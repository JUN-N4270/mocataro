<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>mocataro 素材置き場</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f8fc;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Yu Gothic",
    sans-serif;
}


/* =========================
   ヘッダー
========================= */

header {
  background: linear-gradient(135deg, #1976d2, #42a5f5);
  color: white;
  text-align: center;
  padding: 28px 15px 24px;
  box-shadow: 0 3px 10px rgba(0,0,0,.15);
}

header h1 {
  margin: 0;
  font-size: 28px;
  letter-spacing: 1px;
}

header p {
  margin: 8px 0 0;
  font-size: 14px;
  opacity: .95;
}


/* =========================
   カテゴリ
========================= */

.category-area {
  padding: 18px 12px 8px;
  text-align: center;
}

.category-buttons {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}

.category-btn {
  border: none;
  background: white;
  color: #1976d2;
  border: 2px solid #90caf9;
  border-radius: 999px;
  padding: 8px 15px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.category-btn.active {
  background: #1976d2;
  color: white;
  border-color: #1976d2;
}


/* =========================
   素材一覧
========================= */

.materials {
  width: min(1100px, 94%);
  margin: 15px auto 50px;

  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(160px, 1fr));

  gap: 16px;
}


/* =========================
   カード
========================= */

.card {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(0,0,0,.10);

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.card:active {
  transform: scale(.97);
}


/* =========================
   画像
========================= */

.image-box {
  width: 100%;
  aspect-ratio: 1 / 1;

  background:
    linear-gradient(45deg,#eee 25%,transparent 25%),
    linear-gradient(-45deg,#eee 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#eee 75%),
    linear-gradient(-45deg,transparent 75%,#eee 75%);

  background-size: 20px 20px;

  background-position:
    0 0,
    0 10px,
    10px -10px,
    -10px 0;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

.image-box img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}


/* =========================
   カード情報
========================= */

.card-info {
  padding: 11px 12px 13px;
}

.card-title {
  font-weight: bold;
  font-size: 15px;
  margin-bottom: 4px;
}

.card-description {
  font-size: 12px;
  color: #777;
  margin-bottom: 9px;
}


/* =========================
   URL
========================= */

.url-label {
  font-size: 11px;
  font-weight: bold;
  color: #555;
  margin-bottom: 4px;
}

.url-box {
  width: 100%;

  background: #f1f3f5;
  border: 1px solid #ddd;
  border-radius: 7px;

  padding: 7px 8px;

  font-size: 10px;
  color: #555;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  user-select: text;
}


/* =========================
   URLコピー
========================= */

.copy-btn {
  display: block;

  width: 100%;

  margin-top: 7px;

  border: none;
  border-radius: 9px;

  background: #455a64;
  color: white;

  padding: 9px 5px;

  font-size: 12px;
  font-weight: bold;

  cursor: pointer;
}

.copy-btn:active {
  transform: scale(.97);
}

.copy-btn.copied {
  background: #43a047;
}


/* =========================
   ゲームを開く
========================= */

.game-btn {
  display: block;

  width: 100%;

  margin-top: 7px;

  border: none;
  border-radius: 9px;

  background: #7b1fa2;
  color: white;

  padding: 10px 5px;

  font-size: 13px;
  font-weight: bold;

  cursor: pointer;

  text-align: center;
  text-decoration: none;
}

.game-btn:active {
  transform: scale(.97);
}


/* =========================
   PNG保存
========================= */

.download-btn {
  display: block;

  width: 100%;

  margin-top: 7px;

  border: none;
  border-radius: 9px;

  background: #1976d2;
  color: white;

  padding: 9px 5px;

  font-size: 13px;
  font-weight: bold;

  cursor: pointer;

  text-align: center;
  text-decoration: none;
}

.download-btn:active {
  transform: scale(.97);
}


/* =========================
   モーダル
========================= */

.modal {
  display: none;

  position: fixed;
  inset: 0;

  background: rgba(0,0,0,.78);

  z-index: 1000;

  padding: 20px;

  align-items: center;
  justify-content: center;
}

.modal.show {
  display: flex;
}

.modal-content {
  width: min(700px, 100%);
  max-height: 95vh;

  background: white;
  border-radius: 18px;

  overflow: hidden;

  position: relative;
}

.modal-image-area {
  background: #f3f3f3;

  padding: 15px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-image {
  max-width: 100%;
  max-height: 65vh;

  object-fit: contain;
}

.modal-info {
  padding: 15px;
}

.modal-title {
  font-size: 19px;
  font-weight: bold;
}

.modal-description {
  font-size: 13px;
  color: #666;
  margin-top: 5px;
}


/* =========================
   モーダルURL
========================= */

.modal-url-label {
  font-size: 11px;
  font-weight: bold;
  color: #555;

  margin-top: 12px;
  margin-bottom: 4px;
}

.modal-url-box {
  background: #f1f3f5;
  border: 1px solid #ddd;
  border-radius: 7px;

  padding: 8px;

  font-size: 11px;

  word-break: break-all;

  user-select: text;
}


/* =========================
   モーダルコピー
========================= */

.modal-copy {
  display: block;

  width: 100%;

  margin-top: 7px;

  background: #455a64;
  color: white;

  border: none;
  border-radius: 9px;

  padding: 10px;

  font-weight: bold;

  cursor: pointer;
}

.modal-copy.copied {
  background: #43a047;
}


/* =========================
   モーダルゲーム
========================= */

.modal-game {
  display: block;

  width: 100%;

  margin-top: 7px;

  background: #7b1fa2;
  color: white;

  text-align: center;

  padding: 12px;

  border-radius: 10px;

  text-decoration: none;

  font-weight: bold;
}


/* =========================
   モーダルPNG
========================= */

.modal-download {
  display: block;

  margin-top: 7px;

  background: #1976d2;
  color: white;

  text-align: center;

  padding: 12px;

  border-radius: 10px;

  text-decoration: none;

  font-weight: bold;
}


/* =========================
   閉じる
========================= */

.close-btn {
  position: absolute;

  right: 10px;
  top: 10px;

  width: 38px;
  height: 38px;

  border: none;
  border-radius: 50%;

  background: rgba(0,0,0,.65);
  color: white;

  font-size: 22px;

  cursor: pointer;

  z-index: 10;
}


/* =========================
   フッター
========================= */

footer {
  text-align: center;
  padding: 25px 10px 35px;
  font-size: 12px;
  color: #888;
}


/* =========================
   PC
========================= */

@media (min-width: 700px) {

  .materials {
    grid-template-columns:
      repeat(auto-fill, minmax(190px, 1fr));
  }

  header h1 {
    font-size: 34px;
  }
}
</style>
</head>


<body>

<header>

  <h1>📦 mocataro 素材置き場</h1>

  <p>
    ゲームや印刷に使える素材をまとめています
  </p>

</header>


<!-- =========================
     カテゴリ
========================= -->

<div class="category-area">

  <div class="category-buttons">

    <button
      class="category-btn active"
      data-category="all">
      すべて
    </button>

    <button
      class="category-btn"
      data-category="puzzle">
      🧩 パズル
    </button>

    <button
      class="category-btn"
      data-category="print">
      🖨️ 印刷素材
    </button>

    <button
      class="category-btn"
      data-category="other">
      🎨 その他
    </button>

  </div>

</div>


<!-- =========================
     素材一覧
========================= -->

<div
  id="materials"
  class="materials">
</div>


<footer>
  © mocataro
</footer>


<!-- =========================
     モーダル
========================= -->

<div
  id="modal"
  class="modal">

  <div class="modal-content">

    <button
      id="closeBtn"
      class="close-btn">
      ×
    </button>


    <div class="modal-image-area">

      <img
        id="modalImage"
        class="modal-image"
        src=""
        alt="">

    </div>


    <div class="modal-info">

      <div
        id="modalTitle"
        class="modal-title">
      </div>

      <div
        id="modalDescription"
        class="modal-description">
      </div>


      <!-- URL -->

      <div
        id="modalUrlLabel"
        class="modal-url-label">
        🔗 URL
      </div>

      <div
        id="modalUrl"
        class="modal-url-box">
      </div>


      <button
        id="modalCopy"
        class="modal-copy">
        📋 URLをコピー
      </button>


      <!-- ゲーム -->

      <a
        id="modalGame"
        class="modal-game"
        href=""
        target="_blank">
        🎮 ゲームを開く
      </a>


      <!-- PNG -->

      <a
        id="modalDownload"
        class="modal-download"
        href=""
        download>
        📥 PNGをダウンロード
      </a>

    </div>

  </div>

</div>


<script>

/* =====================================================
   素材データ
===================================================== */

const materials = [

  /* =========================
     印刷素材
  ========================= */

  {
    title: "絵カード1-6",
    description: "印刷素材",
    category: "print",
    type: "material",
    image: "print/card1-6.png"
  },

  {
    title: "絵カード7-9",
    description: "印刷素材",
    category: "print",
    type: "material",
    image: "print/card7-9.png"
  },

  {
    title: "①〜⑨",
    description: "印刷素材",
    category: "print",
    type: "material",
    image: "print/num1-9.png"
  },

 {
    title: "さいころ",
    description: "印刷素材",
    category: "print",
    type: "material",
    image: "print/dice1-9.png"
  },

 {
    title: "フルーツ",
    description: "印刷素材",
    category: "print",
    type: "material",
    image: "materials/fruits.png"
  }, 

      
 {
    title: "４マス-問題",
    description: "印刷素材",
    category: "print",
    type: "material",
    image: "materials/4masu_mondai.png"
  }, 
 {
    title: "４マス-ピース",
    description: "印刷素材",
    category: "print",
    type: "material",
    image: "materials/4masu_piece.png"
  },

 {
    title: "〇△□",
    description: "印刷素材",
    category: "print",
    type: "material",
    image: "materials/marusannkakusikaku.png"
  },
 {
    title: "指先集中⓵",
    description: "印刷素材",
    category: "print",
    type: "material",
    image: "materials/yubisaki_1.png"
  }, 

 {
    title: "指先集中⓶",
    description: "印刷素材",
    category: "print",
    type: "material",
    image: "materials/yubisaki_2.png"
  },      
      
{
    title: "指先集中⓷",
    description: "印刷素材",
    category: "print",
    type: "material",
    image: "materials/yubisaki_3.png"
  },      
      
      
 {
    title: "トコトコ",
    description: "印刷素材",
    category: "print",
    type: "material",
    image: "print/tokotoko.png"
  },

  {
    title: "Ｔパズル",
    description: "印刷素材",
    category: "print",
    type: "material",
    image: "materials/T_puzzle.png"
  },

  {
    title: "長方形パズル",
    description: "印刷素材",
    category: "print",
    type: "material",
    image: "materials/4piece_puzzle.png"
  },
 {
    title: "ロバパズル",
    description: "印刷素材",
    category: "print",
    type: "material",
    image: "materials/Roba_puzzle.png"
  },

  /* =========================
     ゲーム
  ========================= */

  {
    title: "Ｔパズル",
    description: "puzzle",
    category: "puzzle",
    type: "game",

    image: "materials/T_puzzle.png",

    url:
      "https://jun-n4270.github.io/mocataro/Play/T_puzzle/index.html"
  },
  {
    title: "長方形パズル",
    description: "puzzle",
    category: "puzzle",
    type: "game",
    image: "materials/4piece_puzzle.png",
    url:
      "https://jun-n4270.github.io/mocataro/Play/4piece_puzzle/index.html"
  },
  {
    title: "ロバパズル",
    description: "puzzle",
    category: "puzzle",
    type: "game",

    image: "materials/Roba_puzzle.png",

    url:
      "https://jun-n4270.github.io/mocataro/Play/Roba_pazzle/index.html"
  },
  {
    title: "チリトリパズル",
    description: "puzzle",
    category: "puzzle",
    type: "game",

    image: "materials/chiritori.png",

    url:
      "https://jun-n4270.github.io/mocataro/Play/chiritori/index.html"
  },


];


/* =====================================================
   素材一覧
===================================================== */

const materialsArea =
  document.getElementById("materials");


function showMaterials(category = "all") {

  materialsArea.innerHTML = "";


  const filtered =
    category === "all"
      ? materials
      : materials.filter(
          item => item.category === category
        );


  filtered.forEach(item => {

    const card =
      document.createElement("div");

    card.className = "card";


    /* =========================
       URLを決定
    ========================= */

    let itemUrl;


    if (item.type === "game") {

      itemUrl =
        item.url;

    } else {

      itemUrl =
        new URL(
          item.image,
          window.location.href
        ).href;

    }


    /* =========================
       画像
    ========================= */

    const imageBox =
      document.createElement("div");

    imageBox.className =
      "image-box";


    const img =
      document.createElement("img");

    img.src =
      item.image;

    img.alt =
      item.title;


    imageBox.appendChild(img);


    imageBox.addEventListener(
      "click",
      () => openModal(item)
    );


    /* =========================
       情報
    ========================= */

    const info =
      document.createElement("div");

    info.className =
      "card-info";


    const title =
      document.createElement("div");

    title.className =
      "card-title";

    title.textContent =
      item.title;


    const description =
      document.createElement("div");

    description.className =
      "card-description";

    description.textContent =
      item.description;


    /* =========================
       URLラベル
    ========================= */

    const urlLabel =
      document.createElement("div");

    urlLabel.className =
      "url-label";

    urlLabel.textContent =
      item.type === "game"
        ? "🎮 ゲームURL"
        : "🔗 素材URL";


    /* =========================
       URL表示
    ========================= */

    const urlBox =
      document.createElement("div");

    urlBox.className =
      "url-box";

    urlBox.textContent =
      itemUrl;


    /* =========================
       コピー
    ========================= */

    const copyButton =
      document.createElement("button");

    copyButton.className =
      "copy-btn";

    copyButton.textContent =
      "📋 URLをコピー";


    copyButton.addEventListener(
      "click",
      async event => {

        event.stopPropagation();

        await copyUrl(
          itemUrl,
          copyButton
        );

      }
    );


    /* =========================
       ゲームボタン
    ========================= */

    let gameButton;


    if (item.type === "game") {

      gameButton =
        document.createElement("a");

      gameButton.className =
        "game-btn";

      gameButton.href =
        item.url;

      gameButton.target =
        "_blank";

      gameButton.textContent =
        "🎮 ゲームを開く";

    }


    /* =========================
       PNG保存
    ========================= */

    let download;


    if (item.type === "material") {

      download =
        document.createElement("a");

      download.className =
        "download-btn";

      download.href =
        item.image;

      download.download =
        "";

      download.textContent =
        "📥 PNGを保存";

    }


    /* =========================
       組み立て
    ========================= */

    info.appendChild(title);

    info.appendChild(description);

    info.appendChild(urlLabel);

    info.appendChild(urlBox);

    info.appendChild(copyButton);


    if (gameButton) {

      info.appendChild(
        gameButton
      );

    }


    if (download) {

      info.appendChild(
        download
      );

    }


    card.appendChild(imageBox);

    card.appendChild(info);


    materialsArea.appendChild(card);

  });

}


/* =====================================================
   URLコピー
===================================================== */

async function copyUrl(
  url,
  button
) {

  try {

    await navigator.clipboard.writeText(
      url
    );

  } catch (error) {

    const textArea =
      document.createElement("textarea");

    textArea.value =
      url;

    document.body.appendChild(
      textArea
    );

    textArea.select();

    document.execCommand(
      "copy"
    );

    textArea.remove();

  }


  button.textContent =
    "✅ コピーしました！";

  button.classList.add(
    "copied"
  );


  setTimeout(() => {

    button.textContent =
      "📋 URLをコピー";

    button.classList.remove(
      "copied"
    );

  }, 1500);

}


/* =====================================================
   カテゴリ切り替え
===================================================== */

document
  .querySelectorAll(".category-btn")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".category-btn")
          .forEach(btn =>
            btn.classList.remove(
              "active"
            )
          );


        button.classList.add(
          "active"
        );


        showMaterials(
          button.dataset.category
        );

      }
    );

  });


/* =====================================================
   モーダル
===================================================== */

const modal =
  document.getElementById("modal");

const modalImage =
  document.getElementById("modalImage");

const modalTitle =
  document.getElementById("modalTitle");

const modalDescription =
  document.getElementById("modalDescription");

const modalUrlLabel =
  document.getElementById("modalUrlLabel");

const modalUrl =
  document.getElementById("modalUrl");

const modalCopy =
  document.getElementById("modalCopy");

const modalGame =
  document.getElementById("modalGame");

const modalDownload =
  document.getElementById("modalDownload");


let currentModalUrl = "";


/* =========================
   モーダルを開く
========================= */

function openModal(item) {

  let itemUrl;


  if (item.type === "game") {

    itemUrl =
      item.url;

  } else {

    itemUrl =
      new URL(
        item.image,
        window.location.href
      ).href;

  }


  modalImage.src =
    item.image;

  modalImage.alt =
    item.title;


  modalTitle.textContent =
    item.title;


  modalDescription.textContent =
    item.description;


  modalUrlLabel.textContent =
    item.type === "game"
      ? "🎮 ゲームURL"
      : "🔗 素材URL";


  modalUrl.textContent =
    itemUrl;


  currentModalUrl =
    itemUrl;


  modalCopy.textContent =
    "📋 URLをコピー";

  modalCopy.classList.remove(
    "copied"
  );


  /* =========================
     ゲーム
  ========================= */

  if (item.type === "game") {

    modalGame.style.display =
      "block";

    modalGame.href =
      item.url;

  } else {

    modalGame.style.display =
      "none";

  }


  /* =========================
     PNG
  ========================= */

  if (item.type === "material") {

    modalDownload.style.display =
      "block";

    modalDownload.href =
      item.image;

  } else {

    modalDownload.style.display =
      "none";

  }


  modal.classList.add(
    "show"
  );

}


/* =====================================================
   モーダルURLコピー
===================================================== */

modalCopy.addEventListener(
  "click",
  async () => {

    await copyUrl(
      currentModalUrl,
      modalCopy
    );

  }
);


/* =====================================================
   モーダルを閉じる
===================================================== */

document
  .getElementById("closeBtn")
  .addEventListener(
    "click",
    closeModal
  );


modal.addEventListener(
  "click",
  event => {

    if (
      event.target === modal
    ) {

      closeModal();

    }

  }
);


function closeModal() {

  modal.classList.remove(
    "show"
  );

}


/* =====================================================
   初期表示
===================================================== */

showMaterials();

</script>

</body>
</html>
