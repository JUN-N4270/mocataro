```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>mocataro 素材置き場</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f8fc;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Yu Gothic",
    sans-serif;
}


/* =========================
   ヘッダー
========================= */

header {
  background: linear-gradient(135deg, #1976d2, #42a5f5);
  color: white;
  text-align: center;
  padding: 28px 15px 24px;
  box-shadow: 0 3px 10px rgba(0,0,0,.15);
}

header h1 {
  margin: 0;
  font-size: 28px;
  letter-spacing: 1px;
}

header p {
  margin: 8px 0 0;
  font-size: 14px;
  opacity: .95;
}


/* =========================
   カテゴリ
========================= */

.category-area {
  padding: 18px 12px 8px;
  text-align: center;
}

.category-buttons {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}

.category-btn {
  border: none;
  background: white;
  color: #1976d2;
  border: 2px solid #90caf9;
  border-radius: 999px;
  padding: 8px 15px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.category-btn.active {
  background: #1976d2;
  color: white;
  border-color: #1976d2;
}


/* =========================
   素材一覧
========================= */

.materials {
  width: min(1100px, 94%);
  margin: 15px auto 50px;

  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(160px, 1fr));

  gap: 16px;
}


/* =========================
   カード
========================= */

.card {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(0,0,0,.10);

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.card:active {
  transform: scale(.97);
}


/* =========================
   画像
========================= */

.image-box {
  width: 100%;
  aspect-ratio: 1 / 1;

  background:
    linear-gradient(45deg,#eee 25%,transparent 25%),
    linear-gradient(-45deg,#eee 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#eee 75%),
    linear-gradient(-45deg,transparent 75%,#eee 75%);

  background-size: 20px 20px;

  background-position:
    0 0,
    0 10px,
    10px -10px,
    -10px 0;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

.image-box img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}


/* =========================
   カード情報
========================= */

.card-info {
  padding: 11px 12px 13px;
}

.card-title {
  font-weight: bold;
  font-size: 15px;
  margin-bottom: 4px;
}

.card-description {
  font-size: 12px;
  color: #777;
  margin-bottom: 9px;
}


/* =========================
   URL
========================= */

.url-label {
  font-size: 11px;
  font-weight: bold;
  color: #555;
  margin-bottom: 4px;
}

.url-box {
  width: 100%;

  background: #f1f3f5;
  border: 1px solid #ddd;
  border-radius: 7px;

  padding: 7px 8px;

  font-size: 10px;
  color: #555;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  user-select: text;
}


/* =========================
   URLコピー
========================= */

.copy-btn {
  display: block;

  width: 100%;

  margin-top: 7px;

  border: none;
  border-radius: 9px;

  background: #455a64;
  color: white;

  padding: 9px 5px;

  font-size: 12px;
  font-weight: bold;

  cursor: pointer;
}

.copy-btn:active {
  transform: scale(.97);
}

.copy-btn.copied {
  background: #43a047;
}


/* =========================
   ゲームを開く
========================= */

.game-btn {
  display: block;

  width: 100%;

  margin-top: 7px;

  border: none;
  border-radius: 9px;

  background: #7b1fa2;
  color: white;

  padding: 10px 5px;

  font-size: 13px;
  font-weight: bold;

  cursor: pointer;

  text-align: center;
  text-decoration: none;
}

.game-btn:active {
  transform: scale(.97);
}


/* =========================
   PNG保存
========================= */

.download-btn {
  display: block;

  width: 100%;

  margin-top: 7px;

  border: none;
  border-radius: 9px;

  background: #1976d2;
  color: white;

  padding: 9px 5px;

  font-size: 13px;
  font-weight: bold;

  cursor: pointer;

  text-align: center;
  text-decoration: none;
}

.download-btn:active {
  transform: scale(.97);
}


/* =========================
   モーダル
========================= */

.modal {
  display: none;

  position: fixed;
  inset: 0;

  background: rgba(0,0,0,.78);

  z-index: 1000;

  padding: 20px;

  align-items: center;
  justify-content: center;
}

.modal.show {
  display: flex;
}

.modal-content {
  width: min(700px, 100%);
  max-height: 95vh;

  background: white;
  border-radius: 18px;

  overflow: hidden;

  position: relative;
}

.modal-image-area {
  background: #f3f3f3;

  padding: 15px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-image {
  max-width: 100%;
  max-height: 65vh;

  object-fit: contain;
}

.modal
```
