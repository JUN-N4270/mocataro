
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>マグネットゲーム</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: sans-serif;
    background: #eef5f8;
}

#game {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* 上部UI */
#topUI {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 105px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 10px 18px;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    z-index: 1000;
}

/* プレイヤー */
.player {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 18px;
    font-weight: bold;
    padding: 7px 12px;
    border-radius: 14px;
    background: transparent;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.player.active {
    background: rgba(255,255,255,0.98);
    transform: scale(1.08);
}

#redPlayer.active {
    box-shadow: 0 0 0 3px rgba(229,57,53,0.38),
                0 0 14px rgba(229,57,53,0.25),
                0 4px 12px rgba(0,0,0,0.16);
}

#bluePlayer.active {
    box-shadow: 0 0 0 3px rgba(25,118,210,0.38),
                0 0 14px rgba(25,118,210,0.25),
                0 4px 12px rgba(0,0,0,0.16);
}

.player.active::after {
    content: "TURN";
    position: absolute;
    right: -4px;
    top: -5px;
    padding: 2px 6px;
    border-radius: 8px;
    background: #333;
    color: white;
    font-size: 9px;
    font-weight: bold;
    line-height: 1.2;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    flex-shrink: 0;
}

.redDot { background: #e53935; }
.blueDot { background: #1976d2; }

.stock {
    font-size: 24px;
    font-weight: bold;
}

/* やり直す */
#resetButton {
    position: absolute;
    left: 50%;
    top: 27px;
    transform: translate(-50%, -50%);
    border: none;
    padding: 7px 13px;
    border-radius: 10px;
    background: #e8eef2;
    color: #44515a;
    font-size: 14px;
    font-weight: bold;
    box-shadow: 0 2px 5px rgba(0,0,0,0.12);
    white-space: nowrap;
    touch-action: manipulation;
}

/* ルール */
#gameRule {
    position: absolute;
    left: 50%;
    bottom: 5px;
    transform: translateX(-50%);
    width: 100%;
    text-align: center;
    font-size: 12px;
    line-height: 1.35;
    font-weight: normal;
    color: rgba(70,80,85,0.55);
    pointer-events: none;
    white-space: nowrap;
}

/* ボード */
#board {
    position: absolute;
    left: 0;
    top: 105px;
    width: 100%;
    height: calc(100% - 105px);
    overflow: hidden;
}

/* 磁石 */
.magnet {
    position: absolute;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%,
        #666 0%, #292929 30%, #050505 72%, #000 100%);
    border: 2px solid #111;
    box-shadow: inset 3px 3px 5px rgba(255,255,255,0.18),
                inset -3px -3px 5px rgba(0,0,0,0.7),
                0 3px 6px rgba(0,0,0,0.25);
    transform-origin: center center;
    user-select: none;
    touch-action: none;
    will-change: left, top, transform;
}

.magnet::after {
    content: "";
    position: absolute;
    width: 13px;
    height: 13px;
    left: 10px;
    top: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
}

.magnet.dragging {
    transform: scale(1.08);
    box-shadow: 0 8px 16px rgba(0,0,0,0.35),
                inset 3px 3px 5px rgba(255,255,255,0.18),
                inset -3px -3px 5px rgba(0,0,0,0.7);
    z-index: 500;
}

/* 吸着衝撃 */
.magnet.impact {
    animation: impact 0.12s ease-out;
}

@keyframes impact {
    0% { transform: scale(1); }
    50% { transform: scale(1.18); }
    100% { transform: scale(1); }
}

/* 消滅 */
.magnet.fading {
    pointer-events: none;
    animation: fadeOut 0.35s ease forwards;
}

@keyframes fadeOut {
    from { opacity: 1; transform: scale(1); }
    to { opacity: 0; transform: scale(0.65); }
}

/* ターン表示 */
#turnNotice {
    position: absolute;
    left: 50%;
    top: 38%;
    transform: translate(-50%, -50%) scale(0.9);
    padding: 12px 22px;
    border-radius: 16px;
    background: rgba(255,255,255,0.72);
    font-size: 25px;
    font-weight: bold;
    color: rgba(30,30,30,0.72);
    box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    opacity: 0;
    pointer-events: none;
    z-index: 2000;
}

#turnNotice.show {
    animation: turnNotice 1s ease forwards;
}

@keyframes turnNotice {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.88);
    }
    20% {
        opacity: 0.72;
        transform: translate(-50%, -50%) scale(1);
    }
    70% {
        opacity: 0.72;
        transform: translate(-50%, -50%) scale(1);
    }
    100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.03);
    }
}

/* 獲得表示 */
#gainNotice {
    position: absolute;
    left: 50%;
    top: 38%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: bold;
    color: #222;
    opacity: 0;
    pointer-events: none;
    z-index: 2100;
}

#gainNotice.show {
    animation: gain 0.9s ease forwards;
}

@keyframes gain {
    0% {
        opacity: 0;
        transform: translate(-50%, -20%);
    }
    20% {
        opacity: 1;
        transform: translate(-50%, -50%);
    }
    70% {
        opacity: 1;
        transform: translate(-50%, -60%);
    }
    100% {
        opacity: 0;
        transform: translate(-50%, -90%);
    }
}

/* 勝利画面 */
#winScreen {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    z-index: 5000;
}

#winBox {
    background: white;
    padding: 35px 45px;
    border-radius: 24px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

#winText {
    font-size: 36px;
    font-weight: bold;
    margin-bottom: 25px;
}

#restartButton {
    border: none;
    padding: 14px 28px;
    border-radius: 12px;
    background: #333;
    color: white;
    font-size: 18px;
    font-weight: bold;
}
</style>
</head>

<body>
<div id="game">

    <div id="topUI">
        <div id="redPlayer" class="player">
            <span class="dot redDot"></span>
            <span>赤</span>
            <span id="redStock" class="stock">10</span>
        </div>

        <button id="resetButton">やり直す</button>

        <div id="bluePlayer" class="player">
            <span class="dot blueDot"></span>
            <span>青</span>
            <span id="blueStock" class="stock">10</span>
        </div>

        <div id="gameRule">
            くっつけた磁石は、自分の手持ちになる。<br>
            手持ちの磁石をゼロにしたら勝ち🏅
        </div>
    </div>

    <div id="board"></div>
    <div id="turnNotice"></div>
    <div id="gainNotice"></div>

    <div id="winScreen">
        <div id="winBox">
            <div id="winText"></div>
            <button id="restartButton">もう一度遊ぶ</button>
        </div>
    </div>

</div>

<script>
/* =========================================================
   設定
   引力の強さ・範囲は変更しない
========================================================= */

const R = 27;
const MAGNET_SIZE = R * 2;
const CONTACT_DISTANCE = MAGNET_SIZE;
const STICK_DISTANCE = 105;
const ATTRACT_DISTANCE = 150;
const MAGNET_FORCE = 0.65;
const IMPULSE = 7;
const FRICTION = 0.92;
const STOP_SPEED = 0.08;
const REMOVE_DELAY = 500;
const FADE_TIME = 350;
const INITIAL_STOCK = 10;
const SETTLED_FRAMES_REQUIRED = 12;
const DRAG_SPEED_LIMIT = 8;

/* =========================================================
   DOM
========================================================= */

const board = document.getElementById("board");
const redStockEl = document.getElementById("redStock");
const blueStockEl = document.getElementById("blueStock");
const redPlayerEl = document.getElementById("redPlayer");
const bluePlayerEl = document.getElementById("bluePlayer");
const resetButton = document.getElementById("resetButton");
const turnNotice = document.getElementById("turnNotice");
const gainNotice = document.getElementById("gainNotice");
const winScreen = document.getElementById("winScreen");
const winText = document.getElementById("winText");
const restartButton = document.getElementById("restartButton");

/* =========================================================
   状態
========================================================= */

let currentPlayer = "red";
let redStock = INITIAL_STOCK;
let blueStock = INITIAL_STOCK;
let magnets = [];

let draggingMagnet = null;
let pointerOffsetX = 0;
let pointerOffsetY = 0;
let turnLocked = false;
let gameOver = false;
let nextMagnetId = 1;
let draggingNewMagnet = false;

/*
 * 操作中のプレイヤーと磁石を記録する。
 * 別の場所にあるクラスターの状態には依存させない。
 */
let operationPlayer = null;
let operationMagnet = null;
let operationAbsorbed = false;

/*
 * 今回の操作によって吸着したクラスターだけを追跡。
 * 別のクラスターによる上書きを防止する。
 */
let operationCluster = null;

let settledFrames = 0;

/* ドラッグ速度 */
let dragVX = 0;
let dragVY = 0;

/* =========================================================
   ターン表示
========================================================= */

function updateTurnFocus() {
    redPlayerEl.classList.toggle("active", currentPlayer === "red");
    bluePlayerEl.classList.toggle("active", currentPlayer === "blue");
}

function showTurnNotice(player) {
    updateTurnFocus();

    turnNotice.classList.remove("show");
    void turnNotice.offsetWidth;

    turnNotice.textContent =
        player === "red" ? "🔴 赤のターン" : "🔵 青のターン";

    turnNotice.classList.add("show");
}

function nextTurn() {
    if (gameOver || turnLocked) return;

    currentPlayer = currentPlayer === "red" ? "blue" : "red";
    showTurnNotice(currentPlayer);
}

/* =========================================================
   操作管理
========================================================= */

function beginOperation(player, magnet) {
    operationPlayer = player;
    operationMagnet = magnet;
    operationAbsorbed = false;
    operationCluster = null;
    settledFrames = 0;
    turnLocked = true;
}

/* 操作情報を初期化 */
function clearOperation() {
    operationPlayer = null;
    operationMagnet = null;
    operationAbsorbed = false;
    operationCluster = null;
    settledFrames = 0;
}

/*
 * 操作完了処理はここに一本化する。
 * ターンを交代する前に勝敗を判定する。
 */
function completeOperation() {
    if (!operationPlayer || gameOver) return;

    clearOperation();
    turnLocked = false;

    if (!checkWin()) {
        nextTurn();
    }
}

/*
 * 吸着した場合、対象クラスターの消滅が完了するまで待つ。
 * 別の場所にあるクラスターは待つ条件にしない。
 */
function finishOperationIfSettled() {
    if (gameOver || !operationPlayer || draggingMagnet) {
        settledFrames = 0;
        return;
    }

    if (operationAbsorbed) {
        /*
         * 吸着したクラスターが残っている間は待つ。
         * removeCluster() が獲得後に完了処理を呼ぶ。
         */
        if (operationCluster && operationCluster.members.size > 0) {
            settledFrames = 0;
            return;
        }

        /*
         * 吸着済みなのに追跡クラスターがなくなった場合の
         * 保険。獲得処理が残っていないときだけ完了する。
         */
        if (!operationCluster) {
            completeOperation();
        }

        return;
    }

    /*
     * 吸着していない場合は、自由磁石の動きが
     * 落ち着いたかを確認する。
     * 無関係なクラスターは判定に含めない。
     */
    const movingFreeMagnet = magnets.some(m => {
        if (
            !m.active ||
            m.scheduledRemove ||
            m.cluster ||
            m === draggingMagnet
        ) {
            return false;
        }

        return Math.hypot(m.vx, m.vy) > STOP_SPEED;
    });

    if (movingFreeMagnet) {
        settledFrames = 0;
        return;
    }

    /*
     * 操作した磁石が、他の磁石と吸着距離内に残っていれば
     * 物理処理による吸着判定を待つ。
     */
    if (operationMagnet && operationMagnet.active) {
        for (const other of magnets) {
            if (
                other === operationMagnet ||
                !other.active ||
                other.scheduledRemove
            ) {
                continue;
            }

            if (distance(operationMagnet, other) <= STICK_DISTANCE) {
                settledFrames = 0;
                return;
            }
        }
    }

    settledFrames++;

    if (settledFrames >= SETTLED_FRAMES_REQUIRED) {
        completeOperation();
    }
}

/* =========================================================
   磁石生成・描画
========================================================= */

function createMagnet(x, y) {
    const el = document.createElement("div");
    el.className = "magnet";
    el.style.left = `${x - R}px`;
    el.style.top = `${y - R}px`;

    board.appendChild(el);

    const magnet = {
        id: nextMagnetId++,
        x,
        y,
        vx: 0,
        vy: 0,
        owner: currentPlayer,
        el,
        active: true,
        cluster: null,
        scheduledRemove: false
    };

    magnets.push(magnet);
    return magnet;
}

function renderMagnet(magnet) {
    if (!magnet || !magnet.active) return;

    magnet.el.style.left = `${magnet.x - R}px`;
    magnet.el.style.top = `${magnet.y - R}px`;
}

function renderCluster(cluster) {
    if (!cluster) return;

    for (const magnet of cluster.members) {
        renderMagnet(magnet);
    }
}

/* =========================================================
   ストック
========================================================= */

function getStock(player) {
    return player === "red" ? redStock : blueStock;
}

function setStock(player, value) {
    if (player === "red") {
        redStock = value;
        redStockEl.textContent = value;
    } else {
        blueStock = value;
        blueStockEl.textContent = value;
    }
}

/* =========================================================
   距離
========================================================= */

function distance(a, b) {
    return Math.hypot(b.x - a.x, b.y - a.y);
}

/* =========================================================
   クラスター生成
========================================================= */

function createCluster(magnet, collector = null) {
    if (magnet.cluster) return magnet.cluster;

    const cluster = {
        members: new Set([magnet]),
        bonds: [],
        vx: magnet.vx,
        vy: magnet.vy,
        collector: collector || operationPlayer || currentPlayer,
        removeTimer: null,
        fadeTimer: null,
        removing: false
    };

    magnet.cluster = cluster;
    return cluster;
}

/* =========================================================
   結合距離維持
========================================================= */

function solveBonds(cluster) {
    if (!cluster) return;

    for (const bond of cluster.bonds) {
        const a = bond.a;
        const b = bond.b;

        if (!a.active || !b.active) continue;

        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 1;
        const diff = d - CONTACT_DISTANCE;
        const nx = dx / d;
        const ny = dy / d;
        const correction = diff * 0.5;

        a.x += nx * correction;
        a.y += ny * correction;
        b.x -= nx * correction;
        b.y -= ny * correction;
    }
}

/* =========================================================
   クラスター結合
========================================================= */

function mergeClusters(clusterA, clusterB, magnetA, magnetB, collector) {
    if (!clusterA || !clusterB) return null;
    if (clusterA === clusterB) return clusterA;

    const wasOperationCluster =
        clusterA === operationCluster ||
        clusterB === operationCluster;

    const finalCollector =
        operationPlayer ||
        collector ||
        clusterA.collector ||
        clusterB.collector ||
        currentPlayer;

    cancelRemoval(clusterA);
    cancelRemoval(clusterB);

    /*
     * 接触位置を補正する。
     */
    const dx = magnetB.x - magnetA.x;
    const dy = magnetB.y - magnetA.y;
    const d = Math.hypot(dx, dy) || 1;
    const nx = dx / d;
    const ny = dy / d;
    const correction = d - CONTACT_DISTANCE;

    for (const magnet of clusterA.members) {
        magnet.x += nx * correction * 0.5;
        magnet.y += ny * correction * 0.5;
    }

    for (const magnet of clusterB.members) {
        magnet.x -= nx * correction * 0.5;
        magnet.y -= ny * correction * 0.5;
    }

    /*
     * 結合前の速度を引き継ぐ。
     */
    const merged = {
        members: new Set(),
        bonds: [],
        vx: (clusterA.vx + clusterB.vx) / 2,
        vy: (clusterA.vy + clusterB.vy) / 2,
        collector: finalCollector,
        removeTimer: null,
        fadeTimer: null,
        removing: false
    };

    for (const magnet of clusterA.members) {
        merged.members.add(magnet);
        magnet.cluster = merged;
    }

    for (const magnet of clusterB.members) {
        merged.members.add(magnet);
        magnet.cluster = merged;
    }

    merged.bonds.push(...clusterA.bonds, ...clusterB.bonds);
    merged.bonds.push({ a: magnetA, b: magnetB });

    clusterA.members.clear();
    clusterA.bonds.length = 0;

    clusterB.members.clear();
    clusterB.bonds.length = 0;

    /*
     * 操作中のクラスターが結合された場合は、
     * 新しいクラスターに追跡先を更新する。
     */
    if (wasOperationCluster) {
        operationCluster = merged;
    }

    solveBonds(merged);
    renderCluster(merged);

    return merged;
}

/* =========================================================
   吸着衝撃と慣性
========================================================= */

function kickCluster(cluster, from, to) {
    const dx = to.x - from.x;
    const dy = to.y - from.y;
    const d = Math.hypot(dx, dy) || 1;

    cluster.vx += dx / d * IMPULSE;
    cluster.vy += dy / d * IMPULSE;

    const speed = Math.hypot(cluster.vx, cluster.vy);
    const maxSpeed = 12;

    if (speed > maxSpeed) {
        cluster.vx = cluster.vx / speed * maxSpeed;
        cluster.vy = cluster.vy / speed * maxSpeed;
    }

    for (const magnet of cluster.members) {
        magnet.vx = cluster.vx;
        magnet.vy = cluster.vy;

        magnet.el.classList.remove("impact");
        void magnet.el.offsetWidth;
        magnet.el.classList.add("impact");
    }
}

/* =========================================================
   最近接磁石
========================================================= */

function findNearestTarget(magnet, maxDistance) {
    let best = null;
    let bestDistance = Infinity;

    for (const other of magnets) {
        if (
            other === magnet ||
            !other.active ||
            other.scheduledRemove
        ) {
            continue;
        }

        if (magnet.cluster && other.cluster === magnet.cluster) {
            continue;
        }

        const d = distance(magnet, other);

        if (d <= maxDistance && d < bestDistance) {
            best = other;
            bestDistance = d;
        }
    }

    return { target: best, distance: bestDistance };
}

/* =========================================================
   クラスター吸着対象
========================================================= */

function findClusterTarget(cluster) {
    let best = null;
    let bestFrom = null;
    let bestDistance = Infinity;

    for (const a of cluster.members) {
        if (!a.active) continue;

        for (const b of magnets) {
            if (!b.active || b.scheduledRemove) continue;
            if (cluster.members.has(b)) continue;

            const d = distance(a, b);

            if (d <= STICK_DISTANCE && d < bestDistance) {
                best = b;
                bestFrom = a;
                bestDistance = d;
            }
        }
    }

    return {
        target: best,
        from: bestFrom,
        distance: bestDistance
    };
}

/* =========================================================
   連鎖吸着
========================================================= */

function processClusterChain(cluster) {
    let current = cluster;

    for (let i = 0; i < 100; i++) {
        if (!current || current.members.size === 0) break;

        const result = findClusterTarget(current);
        if (!result.target) break;

        const target = result.target;
        const targetCluster = target.cluster || createCluster(target);

        const collector =
            operationPlayer ||
            current.collector ||
            currentPlayer;

        const oldCurrent = current;

        current = mergeClusters(
            current,
            targetCluster,
            result.from,
            target,
            collector
        );

        if (!current) break;

        /*
         * 操作した磁石が連鎖クラスターに含まれる場合だけ、
         * この操作による吸着として記録する。
         */
        if (
            operationMagnet &&
            current.members.has(operationMagnet)
        ) {
            operationAbsorbed = true;
            operationCluster = current;
        } else if (oldCurrent === operationCluster) {
            operationCluster = current;
        }

        turnLocked = true;
        settledFrames = 0;

        kickCluster(current, result.from, target);
        solveBonds(current);
        renderCluster(current);
        cancelRemoval(current);
    }

    return current;
}

/* =========================================================
   吸着
========================================================= */

function stickMagnets(a, b, collector) {
    if (!a.active || !b.active) return null;

    const operationInvolved =
        operationMagnet === a ||
        operationMagnet === b ||
        (a.cluster &&
         operationMagnet &&
         a.cluster.members.has(operationMagnet)) ||
        (b.cluster &&
         operationMagnet &&
         b.cluster.members.has(operationMagnet));

    const finalCollector =
        operationPlayer ||
        collector ||
        currentPlayer;

    const clusterA = a.cluster || createCluster(a, finalCollector);
    const clusterB = b.cluster || createCluster(b, finalCollector);

    if (clusterA === clusterB) return clusterA;

    turnLocked = true;
    settledFrames = 0;

    let merged = mergeClusters(
        clusterA,
        clusterB,
        a,
        b,
        finalCollector
    );

    if (!merged) return null;

    /*
     * 操作した磁石が吸着に参加した場合、
     * 今回の操作のクラスターを登録する。
     */
    if (
        operationInvolved ||
        (operationMagnet && merged.members.has(operationMagnet))
    ) {
        operationAbsorbed = true;
        operationCluster = merged;
    }

    kickCluster(merged, a, b);
    solveBonds(merged);
    renderCluster(merged);

    merged = processClusterChain(merged);

    /*
     * 連鎖で操作クラスターが統合された場合も追跡を維持。
     */
    if (
        operationAbsorbed &&
        operationMagnet &&
        merged &&
        merged.members.has(operationMagnet)
    ) {
        operationCluster = merged;
    }

    return merged;
}

/* =========================================================
   消去タイマー解除
========================================================= */

function cancelRemoval(cluster) {
    if (!cluster) return;

    if (cluster.removeTimer) {
        clearTimeout(cluster.removeTimer);
        cluster.removeTimer = null;
    }

    if (cluster.fadeTimer) {
        clearTimeout(cluster.fadeTimer);
        cluster.fadeTimer = null;
    }

    cluster.removing = false;

    for (const magnet of cluster.members) {
        magnet.scheduledRemove = false;
        magnet.el.classList.remove("fading");
    }
}

/* =========================================================
   クラスター速度
========================================================= */

function clusterSpeed(cluster) {
    return Math.hypot(cluster.vx, cluster.vy);
}

/* =========================================================
   消去予約
========================================================= */

function scheduleRemoval(cluster) {
    if (!cluster || cluster.removing) return;
    if (clusterSpeed(cluster) > STOP_SPEED) return;
    if (findClusterTarget(cluster).target) return;

    cluster.removing = true;

    cluster.removeTimer = setTimeout(() => {
        cluster.removeTimer = null;

        if (!cluster.members.size) {
            cluster.removing = false;

            if (cluster === operationCluster) {
                operationCluster = null;
                if (operationAbsorbed) completeOperation();
            }

            return;
        }

        if (
            clusterSpeed(cluster) > STOP_SPEED ||
            findClusterTarget(cluster).target
        ) {
            cluster.removing = false;
            return;
        }

        for (const magnet of cluster.members) {
            if (!magnet.active) continue;

            magnet.scheduledRemove = true;
            magnet.el.classList.add("fading");
        }

        cluster.fadeTimer = setTimeout(() => {
            cluster.fadeTimer = null;
            removeCluster(cluster);
        }, FADE_TIME);

    }, REMOVE_DELAY);
}

/* =========================================================
   クラスター削除・獲得
========================================================= */

function removeCluster(cluster) {
    if (!cluster) return;

    const isOperationCluster = cluster === operationCluster;
    const members = Array.from(cluster.members).filter(m => m.active);

    /*
     * 空のクラスターが残った場合でも、
     * 操作ロックが取り残されないようにする。
     */
    if (members.length === 0) {
        cluster.members.clear();

        if (isOperationCluster && operationAbsorbed) {
            operationCluster = null;
            completeOperation();
        }

        return;
    }

    const count = members.length;
    const collector = cluster.collector;

    for (const magnet of members) {
        magnet.active = false;
        magnet.cluster = null;
        magnet.el.remove();
    }

    magnets = magnets.filter(m => m.active);

    cluster.members.clear();
    cluster.bonds.length = 0;
    cluster.removeTimer = null;
    cluster.fadeTimer = null;
    cluster.removing = false;

    /*
     * 獲得者はクラスターに保存された値を使用。
     * 削除時のcurrentPlayerには依存しない。
     */
    if (collector) {
        setStock(collector, getStock(collector) + count);
        showGain(collector, count);
    }

    /*
     * 今回の操作クラスターが消えた場合だけ、
     * 操作終了処理を呼ぶ。
     *
     * 他の場所のクラスターが消えても、
     * ターンロック解除には影響させない。
     */
    if (isOperationCluster && operationAbsorbed) {
        operationCluster = null;
        completeOperation();
    }
}

/* =========================================================
   獲得表示
========================================================= */

function showGain(player, count) {
    gainNotice.classList.remove("show");
    void gainNotice.offsetWidth;

    const icon = player === "red" ? "🔴" : "🔵";
    gainNotice.textContent = `${icon} ＋${count}`;
    gainNotice.classList.add("show");
}

/* =========================================================
   勝利判定
========================================================= */

function checkWin() {
    if (gameOver) return true;

    if (redStock <= 0) {
        winGame("🔴 赤の勝ち！");
        return true;
    }

    if (blueStock <= 0) {
        winGame("🔵 青の勝ち！");
        return true;
    }

    return false;
}

function winGame(text) {
    gameOver = true;
    turnLocked = true;
    winText.textContent = text;
    winScreen.style.display = "flex";
}

/* =========================================================
   新しい磁石のドラッグ開始
========================================================= */

function startNewMagnetDrag(x, y) {
    if (turnLocked || gameOver) return;

    const stock = getStock(currentPlayer);
    if (stock <= 0) return;

    const magnet = createMagnet(x, y);
    setStock(currentPlayer, stock - 1);

    beginOperation(currentPlayer, magnet);

    draggingMagnet = magnet;
    draggingNewMagnet = true;
    pointerOffsetX = 0;
    pointerOffsetY = 0;

    dragVX = 0;
    dragVY = 0;

    magnet.el.classList.add("dragging");
}

/* =========================================================
   pointerdown
========================================================= */

board.addEventListener("pointerdown", e => {
    if (gameOver || turnLocked) return;

    const rect = board.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const target = e.target.closest(".magnet");

    if (target) {
        const magnet = magnets.find(m => m.el === target);

        if (!magnet || magnet.cluster || magnet.scheduledRemove) {
            return;
        }

        /*
         * 赤・青の所有者に関係なく、
         * 単体の磁石なら動かせる。
         */
        beginOperation(currentPlayer, magnet);

        draggingMagnet = magnet;
        draggingNewMagnet = false;

        pointerOffsetX = magnet.x - x;
        pointerOffsetY = magnet.y - y;

        dragVX = 0;
        dragVY = 0;

        magnet.el.classList.add("dragging");
        board.setPointerCapture(e.pointerId);

        e.preventDefault();
        return;
    }

    startNewMagnetDrag(x, y);

    if (draggingMagnet) {
        board.setPointerCapture(e.pointerId);
        e.preventDefault();
    }
});

/* =========================================================
   pointermove
========================================================= */

board.addEventListener("pointermove", e => {
    if (!draggingMagnet) return;

    const magnet = draggingMagnet;
    const rect = board.getBoundingClientRect();

    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const newX = x + pointerOffsetX;
    const newY = y + pointerOffsetY;

    dragVX = newX - magnet.x;
    dragVY = newY - magnet.y;

    const dragSpeed = Math.hypot(dragVX, dragVY);

    if (dragSpeed > DRAG_SPEED_LIMIT) {
        dragVX = dragVX / dragSpeed * DRAG_SPEED_LIMIT;
        dragVY = dragVY / dragSpeed * DRAG_SPEED_LIMIT;
    }

    magnet.x = newX;
    magnet.y = newY;
    magnet.vx = dragVX;
    magnet.vy = dragVY;

    settledFrames = 0;
    renderMagnet(magnet);

    const result = findNearestTarget(magnet, STICK_DISTANCE);

    if (result.target) {
        magnet.vx = dragVX;
        magnet.vy = dragVY;

        magnet.el.classList.remove("dragging");

        draggingMagnet = null;
        draggingNewMagnet = false;

        stickMagnets(magnet, result.target, operationPlayer);
    }
});

/* =========================================================
   pointerup
========================================================= */

board.addEventListener("pointerup", () => {
    if (!draggingMagnet) return;

    const magnet = draggingMagnet;

    draggingMagnet = null;
    draggingNewMagnet = false;

    magnet.el.classList.remove("dragging");

    /*
     * ドラッグの速度を維持し、慣性につなげる。
     */
    magnet.vx = dragVX;
    magnet.vy = dragVY;

    settledFrames = 0;

    const result = findNearestTarget(magnet, STICK_DISTANCE);

    if (result.target) {
        stickMagnets(magnet, result.target, operationPlayer);
    }
});

/* =========================================================
   pointercancel
========================================================= */

board.addEventListener("pointercancel", () => {
    if (!draggingMagnet) return;

    draggingMagnet.el.classList.remove("dragging");

    draggingMagnet.vx = dragVX;
    draggingMagnet.vy = dragVY;

    draggingMagnet = null;
    draggingNewMagnet = false;
    settledFrames = 0;
});

/* =========================================================
   クラスターに働く磁力
   引力設定は既存値のまま
========================================================= */

function applyClusterMagneticForce(cluster) {
    if (!cluster || cluster.members.size === 0) return;

    for (const other of magnets) {
        if (
            !other.active ||
            other.cluster ||
            other.scheduledRemove
        ) {
            continue;
        }

        let nearestMember = null;
        let nearestDistance = Infinity;

        for (const member of cluster.members) {
            if (!member.active) continue;

            const d = distance(member, other);

            if (d < nearestDistance) {
                nearestDistance = d;
                nearestMember = member;
            }
        }

        if (
            !nearestMember ||
            nearestDistance <= 0 ||
            nearestDistance > ATTRACT_DISTANCE
        ) {
            continue;
        }

        const dx = other.x - nearestMember.x;
        const dy = other.y - nearestMember.y;

        const strength =
            MAGNET_FORCE *
            (1 - nearestDistance / ATTRACT_DISTANCE);

        cluster.vx += dx / nearestDistance * strength;
        cluster.vy += dy / nearestDistance * strength;
    }
}

/* =========================================================
   クラスター移動
========================================================= */

function moveCluster(cluster) {
    applyClusterMagneticForce(cluster);

    cluster.vx *= FRICTION;
    cluster.vy *= FRICTION;

    if (Math.abs(cluster.vx) < STOP_SPEED) cluster.vx = 0;
    if (Math.abs(cluster.vy) < STOP_SPEED) cluster.vy = 0;

    for (const magnet of cluster.members) {
        magnet.x += cluster.vx;
        magnet.y += cluster.vy;
    }

    const width = board.clientWidth;
    const height = board.clientHeight;

    for (const magnet of cluster.members) {
        if (magnet.x < R) {
            magnet.x = R;
            cluster.vx = Math.abs(cluster.vx) * 0.6;
        }

        if (magnet.x > width - R) {
            magnet.x = width - R;
            cluster.vx = -Math.abs(cluster.vx) * 0.6;
        }

        if (magnet.y < R) {
            magnet.y = R;
            cluster.vy = Math.abs(cluster.vy) * 0.6;
        }

        if (magnet.y > height - R) {
            magnet.y = height - R;
            cluster.vy = -Math.abs(cluster.vy) * 0.6;
        }
    }

    solveBonds(cluster);

    for (const magnet of cluster.members) {
        magnet.vx = cluster.vx;
        magnet.vy = cluster.vy;
    }
}

/* =========================================================
   単体磁石に働く磁力
========================================================= */

function applyMagneticForce(magnet) {
    let fx = 0;
    let fy = 0;

    for (const other of magnets) {
        if (other === magnet || !other.active || other.cluster) {
            continue;
        }

        const dx = other.x - magnet.x;
        const dy = other.y - magnet.y;
        const d = Math.hypot(dx, dy);

        if (d <= 0 || d > ATTRACT_DISTANCE) continue;

        const strength = MAGNET_FORCE * (1 - d / ATTRACT_DISTANCE);

        fx += dx / d * strength;
        fy += dy / d * strength;
    }

    magnet.vx += fx;
    magnet.vy += fy;
}

/* =========================================================
   自由磁石移動
========================================================= */

function moveFreeMagnet(magnet) {
    applyMagneticForce(magnet);

    magnet.vx *= FRICTION;
    magnet.vy *= FRICTION;

    const speed = Math.hypot(magnet.vx, magnet.vy);
    const maxSpeed = 8;

    if (speed > maxSpeed) {
        magnet.vx = magnet.vx / speed * maxSpeed;
        magnet.vy = magnet.vy / speed * maxSpeed;
    }

    magnet.x += magnet.vx;
    magnet.y += magnet.vy;

    const width = board.clientWidth;
    const height = board.clientHeight;

    if (magnet.x < R) {
        magnet.x = R;
        magnet.vx = Math.abs(magnet.vx) * 0.6;
    }

    if (magnet.x > width - R) {
        magnet.x = width - R;
        magnet.vx = -Math.abs(magnet.vx) * 0.6;
    }

    if (magnet.y < R) {
        magnet.y = R;
        magnet.vy = Math.abs(magnet.vy) * 0.6;
    }

    if (magnet.y > height - R) {
        magnet.y = height - R;
        magnet.vy = -Math.abs(magnet.vy) * 0.6;
    }

    const result = findNearestTarget(magnet, STICK_DISTANCE);

    if (result.target) {
        const collector =
            operationMagnet === magnet && operationPlayer
                ? operationPlayer
                : currentPlayer;

        stickMagnets(magnet, result.target, collector);
    }
}

/* =========================================================
   メイン物理
========================================================= */

function physics() {
    if (!gameOver) {
        const freeMagnets = magnets.filter(m =>
            m.active &&
            !m.cluster &&
            !m.scheduledRemove &&
            m !== draggingMagnet
        );

        for (const magnet of freeMagnets) {
            moveFreeMagnet(magnet);
        }

        /*
         * 毎フレーム、現在のクラスターを収集する。
         * 統合された古いクラスターは空なのでスキップされる。
         */
        const clusters = new Set();

        for (const magnet of magnets) {
            if (magnet.active && magnet.cluster) {
                clusters.add(magnet.cluster);
            }
        }

        for (const cluster of clusters) {
            if (!cluster || cluster.members.size === 0) continue;

            moveCluster(cluster);

            const activeCluster =
                processClusterChain(cluster) || cluster;

            if (!activeCluster || activeCluster.members.size === 0) {
                continue;
            }

            solveBonds(activeCluster);
            renderCluster(activeCluster);

            if (clusterSpeed(activeCluster) <= STOP_SPEED) {
                scheduleRemoval(activeCluster);
            } else {
                cancelRemoval(activeCluster);
            }
        }

        /*
         * 操作終了の判定はここで行う。
         * 別のクラスターが盤面に残っているだけでは
         * ターン終了を妨げない。
         */
        finishOperationIfSettled();
    }

    for (const magnet of magnets) {
        if (!magnet.active) continue;

        if (magnet !== draggingMagnet && !magnet.cluster) {
            renderMagnet(magnet);
        }
    }

    requestAnimationFrame(physics);
}

/* =========================================================
   やり直す
========================================================= */

resetButton.addEventListener("click", () => {
    location.reload();
});

restartButton.addEventListener("click", () => {
    location.reload();
});

/* =========================================================
   初期化
========================================================= */

redStock = INITIAL_STOCK;
blueStock = INITIAL_STOCK;

redStockEl.textContent = redStock;
blueStockEl.textContent = blueStock;

currentPlayer = "red";
updateTurnFocus();
showTurnNotice("red");

requestAnimationFrame(physics);

</script>
