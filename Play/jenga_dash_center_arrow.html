<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#EAF6FC">
<title>ジェンガ・ダッシュ | mocataro</title>
<style>
:root {
  --bg: #EAF6FC;
  --text: #34505F;
  --border: #9CCFE8;
  --blue: #2689BD;
  --red: #E76F8A;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 10px;
  -webkit-tap-highlight-color: transparent;
}
.app {
  width: min(100%, 520px);
  height: calc(100dvh - 20px);
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 14px;
  background: #fff;
  border: 2px solid var(--border);
  border-radius: 20px;
}
h1 { margin: 0; font-size: 20px; text-align: center; }
#startBtn {
  flex: 0 0 auto;
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 14px;
  font-size: 20px;
  font-weight: 900;
  color: #fff;
  background: var(--blue);
  box-shadow: 0 4px 0 #17658e;
  cursor: pointer;
}
#startBtn:active { transform: translateY(2px); box-shadow: 0 2px 0 #17658e; }
#startBtn:disabled { opacity: 0.6; }
.game {
  width: 100%;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.player {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 14px;
  background: #F2F9FD;
  border: 1px solid var(--border);
  overflow: hidden;
}
.display {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 1000;
  font-size: clamp(80px, 24vw, 150px);
  line-height: 1;
  color: var(--text);
  user-select: none;
}
.player.top .display { transform: rotate(180deg); }

/* 矢印は中央の共通エリアに1個だけ表示 */
.arrow-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
#arrowDisplay {
  display: flex;
  align-items: center;
  justify-content: center;
  width: min(58vw, 280px);
  height: min(58vw, 280px);
  font-size: clamp(150px, 42vw, 250px);
  font-weight: 1000;
  line-height: 1;
  color: white;
  border-radius: 26px;
  text-shadow: 0 3px 0 #00000012;
  user-select: none;
}
#arrowDisplay.left { background: var(--red); }
#arrowDisplay.right { background: var(--blue); }
#arrowDisplay.count {
  background: #FFE99A;
  color: var(--text);
  font-size: clamp(100px, 30vw, 170px);
}
#arrowDisplay.blank {
  background: transparent;
  color: transparent;
}
#arrowDisplay.done {
  background: #fff;
  color: var(--text);
  border: 2px solid var(--border);
  font-size: 80px;
}
.stage { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
@media (max-height: 650px) {
  .app { gap: 8px; padding: 10px; }
  h1 { font-size: 17px; }
  #startBtn { padding: 10px; }
  #arrowDisplay { width: min(48vw, 210px); height: min(48vw, 210px); font-size: clamp(120px, 34vw, 190px); }
}
</style>
</head>
<body>
<main class="app">
  <h1>ジェンガ・ダッシュ</h1>
  <button id="startBtn">スタート</button>

  <section class="stage">
    <div class="game">
      <div class="player top">
        <div class="display" id="topDisplay">3</div>
      </div>
      <div class="player bottom">
        <div class="display" id="bottomDisplay">3</div>
      </div>
    </div>

    <div class="arrow-overlay">
      <div id="arrowDisplay" class="blank"> </div>
    </div>
  </section>
</main>

<script>
(() => {
  const TOTAL = 20;
  const startBtn = document.getElementById("startBtn");
  const topDisplay = document.getElementById("topDisplay");
  const bottomDisplay = document.getElementById("bottomDisplay");
  const arrowDisplay = document.getElementById("arrowDisplay");

  let timers = [];
  let running = false;
  let index = 0;
  let sequence = [];

  function clearTimers() {
    timers.forEach(clearTimeout);
    timers = [];
  }

  function later(fn, ms) {
    timers.push(setTimeout(fn, ms));
  }

  // カウントダウンだけは上下それぞれに表示
  function showCountdown(value) {
    topDisplay.textContent = value;
    bottomDisplay.textContent = value;
    topDisplay.style.visibility = "visible";
    bottomDisplay.style.visibility = "visible";
    arrowDisplay.className = "blank";
    arrowDisplay.textContent = "";
  }

  // 矢印は中央に1つだけ。上下の数字は隠す。
  function showArrow(direction) {
    topDisplay.style.visibility = "hidden";
    bottomDisplay.style.visibility = "hidden";
    arrowDisplay.className = direction;
    arrowDisplay.textContent = direction === "left" ? "⬅" : "➡";
  }

  function showBlank() {
    topDisplay.style.visibility = "hidden";
    bottomDisplay.style.visibility = "hidden";
    arrowDisplay.className = "blank";
    arrowDisplay.textContent = "";
  }

  function makeSequence() {
    const arr = [
      ...Array(TOTAL / 2).fill("left"),
      ...Array(TOTAL / 2).fill("right")
    ];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function finish() {
    running = false;
    topDisplay.style.visibility = "hidden";
    bottomDisplay.style.visibility = "hidden";
    arrowDisplay.className = "done";
    arrowDisplay.textContent = "✓";
    startBtn.disabled = false;
    startBtn.textContent = "もう一度スタート";
  }

  function next() {
    if (!running) return;
    if (index >= TOTAL) {
      finish();
      return;
    }

    const direction = sequence[index++];
    showArrow(direction);

    // 矢印を表示してから、次の指示まで間を空ける
    later(() => {
      if (!running) return;
      if (index >= TOTAL) {
        finish();
        return;
      }
      showBlank();
      later(next, 500);
    }, 850);
  }

  function start() {
    clearTimers();
    running = true;
    index = 0;
    sequence = makeSequence();

    startBtn.disabled = true;
    startBtn.textContent = "プレイ中…";

    showCountdown("3");
    later(() => { if (running) showCountdown("2"); }, 700);
    later(() => { if (running) showCountdown("1"); }, 1400);

    later(() => {
      if (!running) return;
      showBlank();
      // カウントダウン後、2〜3秒待って最初の矢印
      later(next, 2000 + Math.random() * 1000);
    }, 2100);
  }

  startBtn.addEventListener("click", start);

  showCountdown("3");
})();
</script>
</body>
</html>
