<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#EAF6FC">
<title>矢印ゲーム | mocataro</title>
<style>
:root {
  --bg: #EAF6FC;
  --text: #34505F;
  --border: #9CCFE8;
  --blue: #2689BD;
  --red: #E76F8A;
  --white: #FFFFFF;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body {
  margin: 0;
  min-height: 100vh;
  padding: 16px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
    "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}
.container {
  width: 100%;
  max-width: 520px;
  text-align: center;
}
h1 {
  margin: 0 0 8px;
  font-size: clamp(26px, 7vw, 36px);
  font-weight: 900;
  letter-spacing: 0.06em;
}
.description {
  margin: 0 0 18px;
  font-size: 14px;
  line-height: 1.7;
}
.game {
  position: relative;
  width: 100%;
  height: min(68vh, 520px);
  min-height: 300px;
  overflow: hidden;
  background: #F2F9FD;
  border: 3px solid var(--border);
  border-radius: 24px;
  display: flex;
  justify-content: center;
  align-items: center;
}
.center-content {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
}
.countdown {
  font-size: clamp(90px, 24vw, 150px);
  font-weight: 900;
  line-height: 1;
  color: var(--text);
  animation: pop 0.25s ease-out;
}
.arrow {
  font-size: clamp(150px, 45vw, 250px);
  line-height: 1;
  font-weight: 900;
  animation: pop 0.12s ease-out;
  user-select: none;
}
.arrow.left {
  color: var(--blue);
}
.arrow.right {
  color: var(--red);
}
.status {
  min-height: 34px;
  margin-top: 12px;
  font-size: 18px;
  font-weight: 800;
}
.controls {
  margin-top: 18px;
}
button {
  width: 100%;
  max-width: 320px;
  padding: 17px 24px;
  border: 0;
  border-radius: 16px;
  background: var(--blue);
  color: white;
  font-size: 21px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 5px 0 #17678F;
  touch-action: manipulation;
}
button:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 #17678F;
}
button:disabled {
  opacity: 0.55;
  cursor: default;
}
.result {
  margin-top: 14px;
  font-size: 20px;
  font-weight: 900;
}
@keyframes pop {
  from {
    transform: scale(0.75);
    opacity: 0.4;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}
@media (max-height: 600px) {
  body {
    padding: 10px;
  }
  .description {
    margin-bottom: 10px;
  }
  .game {
    height: 55vh;
    min-height: 220px;
  }
  .controls {
    margin-top: 12px;
  }
  button {
    padding: 13px;
  }
}
</style>
</head>
<body>
<main class="container">
  <h1>矢印ゲーム</h1>
  <p class="description">
    矢印が出たら、すばやく反応！<br>
    左右の矢印が合計14回出るぞ。
  </p>
  <section class="game" aria-label="矢印ゲーム画面">
    <div class="center-content" id="display">
      <div class="countdown" id="countdown">READY</div>
    </div>
  </section>
  <div class="status" id="status">準備ができたらスタート！</div>
  <div class="controls">
    <button id="startButton">スタート！</button>
  </div>
  <div class="result" id="result"></div>
</main>
<script>
"use strict";
// ===== ゲーム設定 =====
const TOTAL = 14;
const ARROW_DISPLAY_TIME = 500; // 矢印表示：0.5秒
const MIN_WAIT = 500;           // 次の矢印まで：最短0.5秒
const MAX_WAIT = 2000;          // 次の矢印まで：最長2秒
const display = document.getElementById("display");
const statusText = document.getElementById("status");
const startButton = document.getElementById("startButton");
const resultText = document.getElementById("result");
let sequence = [];
let currentIndex = 0;
let running = false;
let timerId = null;
let audioContext = null;
// 左右を7回ずつ用意し、順番をランダムにする
function makeSequence() {
  const arrows = [
    ...Array(7).fill("left"),
    ...Array(7).fill("right")
  ];
  for (let i = arrows.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arrows[i], arrows[j]] = [arrows[j], arrows[i]];
  }
  return arrows;
}
// 効果音「ピコーン」
function playPicoon() {
  try {
    if (!audioContext) {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      audioContext = new AudioContextClass();
    }
    if (audioContext.state === "suspended") {
      audioContext.resume();
    }
    const now = audioContext.currentTime;
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(880, now);
    oscillator.frequency.exponentialRampToValueAtTime(
      1320,
      now + 0.13
    );
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.25, now + 0.025);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.38);
    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start(now);
    oscillator.stop(now + 0.4);
  } catch (error) {
    // 音声が利用できない環境でもゲームは続行する
  }
}
// 表示を切り替える
function showCountdown(value) {
  display.innerHTML = "";
  const element = document.createElement("div");
  element.className = "countdown";
  element.textContent = value;
  display.appendChild(element);
}
// 矢印を表示
function showArrow(direction) {
  display.innerHTML = "";
  const arrow = document.createElement("div");
  arrow.className = "arrow " + direction;
  arrow.textContent = direction === "left" ? "←" : "→";
  arrow.setAttribute(
    "aria-label",
    direction === "left" ? "左" : "右"
  );
  display.appendChild(arrow);
  // 矢印が現れた瞬間に音を鳴らす
  playPicoon();
}
// ゲーム終了
function finishGame() {
  running = false;
  if (timerId !== null) {
    clearTimeout(timerId);
    timerId = null;
  }
  display.innerHTML = "";
  const message = document.createElement("div");
  message.className = "countdown";
  message.style.fontSize = "clamp(42px, 10vw, 64px)";
  message.textContent = "終了！";
  display.appendChild(message);
  statusText.textContent = "14回の矢印が終了！";
  resultText.textContent = "おつかれさま！";
  startButton.textContent = "もう一度プレイ";
  startButton.disabled = false;
}
// 次の矢印を表示
function nextArrow() {
  if (!running) return;
  if (currentIndex >= TOTAL) {
    finishGame();
    return;
  }
  const direction = sequence[currentIndex];
  currentIndex++;
  showArrow(direction);
  statusText.textContent =
    currentIndex + " / " + TOTAL + " 回目";
  // 矢印を0.5秒表示
  timerId = setTimeout(() => {
    if (!running) return;
    display.innerHTML = "";
    // 次の矢印まで0.5〜2秒ランダムに待つ
    const waitTime =
      MIN_WAIT + Math.random() * (MAX_WAIT - MIN_WAIT);
    timerId = setTimeout(() => {
      nextArrow();
    }, waitTime);
  }, ARROW_DISPLAY_TIME);
}
// カウントダウン後にゲーム開始
function startCountdown() {
  let count = 3;
  showCountdown(count);
  statusText.textContent = "準備して！";
  resultText.textContent = "";
  startButton.disabled = true;
  function countDownStep() {
    if (!running) return;
    count--;
    if (count > 0) {
      showCountdown(count);
      timerId = setTimeout(countDownStep, 1000);
    } else {
      showCountdown("GO!");
      statusText.textContent = "スタート！";
      timerId = setTimeout(() => {
        if (!running) return;
        nextArrow();
      }, 500);
    }
  }
  timerId = setTimeout(countDownStep, 1000);
}
// スタート・リスタート
function startGame() {
  if (timerId !== null) {
    clearTimeout(timerId);
    timerId = null;
  }
  running = true;
  currentIndex = 0;
  sequence = makeSequence();
  resultText.textContent = "";
  startButton.disabled = true;
  startButton.textContent = "プレイ中…";
  // iPhoneなどで音声を再生できるよう、操作時に準備
  try {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass && !audioContext) {
      audioContext = new AudioContextClass();
    }
    if (audioContext && audioContext.state === "suspended") {
      audioContext.resume();
    }
  } catch (error) {
    // 音声が利用できなくてもゲームは続行する
  }
  startCountdown();
}
startButton.addEventListener("click", startGame);
</script>
</body>
</html>
