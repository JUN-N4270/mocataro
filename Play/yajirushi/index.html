
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#EAF6FC">
<title>矢印ゲーム | mocataro</title>

<style>
:root {
  --bg: #EAF6FC;
  --text: #34505F;
  --border: #9CCFE8;
  --blue: #2689BD;
  --red: #E76F8A;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 10px;
}

.app {
  width: min(100%, 520px);
  height: calc(100dvh - 20px);
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 14px;
  background: #fff;
  border: 2px solid var(--border);
  border-radius: 20px;
}

h1 {
  margin: 0;
  font-size: 20px;
  text-align: center;
}

#startBtn {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 14px;
  font-size: 20px;
  font-weight: 900;
  color: #fff;
  background: var(--blue);
  box-shadow: 0 4px 0 #17658e;
  cursor: pointer;
}

#startBtn:disabled {
  opacity: 0.6;
}

.stage {
  position: relative;
  flex: 1;
  min-height: 0;
}

.game {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.player {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 14px;
  background: #F2F9FD;
  border: 1px solid var(--border);
  overflow: hidden;
}

.display {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  font-weight: 1000;
  font-size: clamp(80px, 24vw, 150px);
  line-height: 1;
  color: var(--text);
}

.player.top .display {
  transform: rotate(180deg);
}

/* 中央に表示する数字・矢印 */
.arrow-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

#arrowDisplay {
  display: flex;
  align-items: center;
  justify-content: center;
  width: min(65vw, 300px);
  height: min(65vw, 300px);
  font-size: clamp(150px, 42vw, 250px);
  font-weight: 1000;
  line-height: 1;
  color: white;
  border-radius: 26px;
  user-select: none;
}

#arrowDisplay.left {
  background: var(--red);
}

#arrowDisplay.right {
  background: var(--blue);
}

#arrowDisplay.blank {
  background: transparent;
  color: transparent;
}

#arrowDisplay.countdown {
  background: white;
  color: var(--text);
  border: 2px solid var(--border);
  font-size: clamp(100px, 28vw, 180px);
}

#arrowDisplay.done {
  background: #fff;
  color: var(--text);
  border: 2px solid var(--border);
  font-size: 80px;
}

@media (max-height: 650px) {
  .app {
    gap: 8px;
    padding: 10px;
  }

  h1 {
    font-size: 17px;
  }

  #startBtn {
    padding: 10px;
  }

  #arrowDisplay {
    width: min(48vw, 220px);
    height: min(48vw, 220px);
    font-size: clamp(120px, 34vw, 190px);
  }
}
</style>
</head>

<body>
<main class="app">

  <h1>矢印ゲーム</h1>

  <button id="startBtn">スタート</button>

  <section class="stage">

    <div class="game">

      <!-- 対面する人側 -->
      <div class="player top">
        <div class="display" id="topDisplay">3</div>
      </div>

      <!-- 自分側 -->
      <div class="player bottom">
        <div class="display" id="bottomDisplay">3</div>
      </div>

    </div>

    <!-- カウントダウンも矢印も中央に1個だけ表示 -->
    <div class="arrow-overlay">
      <div id="arrowDisplay" class="countdown">3</div>
    </div>

  </section>
</main>

<script>
(() => {
  const TOTAL = 14;

  // 時間設定
  const ARROW_DISPLAY_TIME = 2000; // 矢印表示：2秒
  const MIN_WAIT = 1000;           // 次の矢印まで最短1秒
  const MAX_WAIT = 3000;           // 次の矢印まで最長3秒

  const startBtn = document.getElementById("startBtn");
  const topDisplay = document.getElementById("topDisplay");
  const bottomDisplay = document.getElementById("bottomDisplay");
  const arrowDisplay = document.getElementById("arrowDisplay");

  let timers = [];
  let running = false;
  let index = 0;
  let sequence = [];
  let audioContext = null;

  function clearTimers() {
    timers.forEach(clearTimeout);
    timers = [];
  }

  function later(fn, ms) {
    timers.push(setTimeout(fn, ms));
  }

  // ピコーン♪ 音を生成
  function playPicoon() {
    try {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) return;

      if (!audioContext) {
        audioContext = new AudioContextClass();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      const now = audioContext.currentTime;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = "sine";

      // 少し高くなる、明るい電子音
      oscillator.frequency.setValueAtTime(880, now);
      oscillator.frequency.exponentialRampToValueAtTime(
        1320, now + 0.18
      );

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.3, now + 0.025);
      gain.gain.setValueAtTime(0.22, now + 0.12);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.38);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start(now);
      oscillator.stop(now + 0.4);
    } catch (error) {
      console.warn("音声を再生できませんでした。", error);
    }
  }

  // カウントダウンは中央に1個だけ表示
  function showCountdown(value) {
    topDisplay.style.visibility = "hidden";
    bottomDisplay.style.visibility = "hidden";

    arrowDisplay.className = "countdown";
    arrowDisplay.textContent = value;
  }

  // 矢印は中央に1個だけ表示
  function showArrow(direction) {
    topDisplay.style.visibility = "hidden";
    bottomDisplay.style.visibility = "hidden";

    arrowDisplay.className = direction;
    arrowDisplay.textContent =
      direction === "left" ? "⬅" : "➡";

    // 矢印が出た瞬間に音を鳴らす
    playPicoon();
  }

  // 矢印を消す
  function showBlank() {
    topDisplay.style.visibility = "hidden";
    bottomDisplay.style.visibility = "hidden";

    arrowDisplay.className = "blank";
    arrowDisplay.textContent = "";
  }

  // 左右7回ずつ、順番はランダム
  function makeSequence() {
    const arr = [
      ...Array(TOTAL / 2).fill("left"),
      ...Array(TOTAL / 2).fill("right")
    ];

    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }

    return arr;
  }

  // 20回終了
  function finish() {
    running = false;

    topDisplay.style.visibility = "hidden";
    bottomDisplay.style.visibility = "hidden";

    arrowDisplay.className = "done";
    arrowDisplay.textContent = "✓";

    startBtn.disabled = false;
    startBtn.textContent = "もう一度スタート";
  }

  // 矢印を1回表示
  function next() {
    if (!running) return;

    if (index >= TOTAL) {
      finish();
      return;
    }

    const direction = sequence[index];
    index++;

    showArrow(direction);

    // 2秒後に矢印を消す
    later(() => {
      if (!running) return;

      if (index >= TOTAL) {
        finish();
        return;
      }

      showBlank();

      // 次の矢印まで1〜3秒ランダムに待つ
      const waitTime =
        MIN_WAIT + Math.random() * (MAX_WAIT - MIN_WAIT);

      later(next, waitTime);

    }, ARROW_DISPLAY_TIME);
  }

  // ゲーム開始
  function start() {
    clearTimers();

    running = true;
    index = 0;
    sequence = makeSequence();

    startBtn.disabled = true;
    startBtn.textContent = "プレイ中…";

    // iPhoneなどで音を再生できるよう、操作直後に準備
    try {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (AudioContextClass && !audioContext) {
        audioContext = new AudioContextClass();
      }

      if (audioContext && audioContext.state === "suspended") {
        audioContext.resume();
      }
    } catch (error) {
      console.warn("音声を初期化できませんでした。", error);
    }

    // 3 → 2 → 1（中央に1個）
    showCountdown("3");

    later(() => {
      if (running) showCountdown("2");
    }, 700);

    later(() => {
      if (running) showCountdown("1");
    }, 1400);

    // カウントダウン終了後、最初の矢印まで1〜3秒待つ
    later(() => {
      if (!running) return;

      showBlank();

      const waitTime =
        MIN_WAIT + Math.random() * (MAX_WAIT - MIN_WAIT);

      later(next, waitTime);

    }, 2100);
  }

  startBtn.addEventListener("click", start);

  // 初期画面
  showCountdown("3");

})();
</script>

</body>
</html>
