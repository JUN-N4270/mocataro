<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               user-scalable=no">

<title>Tパズル</title>

<style>

/* ================================
   基本
   ================================ */

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #EAF6FC;

  touch-action: none;

  user-select: none;
}


/* ================================
   タイトル
   ================================ */

h1 {

  text-align: center;

  margin: 14px 0 8px;

  font-size: 22px;
}


/* ================================
   メッセージ
   ================================ */

#message {

  text-align: center;

  font-size: 14px;

  margin-bottom: 8px;
}


/* ================================
   操作方法
   ================================ */

#hint {

  text-align: center;

  margin-top: -2px;

  font-size: 12px;

  color: #AFC1C9;

  font-weight: 400;

  white-space: nowrap;
}


/* ================================
   ボード
   ================================ */

#wrap {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  display: flex;

  align-items: center;

  justify-content: center;
}

svg {

  width: min(96vw, 900px);

  height: min(96vh, 1100px);

  overflow: visible;

  touch-action: none;
}


/* ================================
   ピース
   ================================ */

.piece {

  cursor: grab;
}

.piece:active {

  cursor: grabbing;
}

.shape {

  stroke: #34505F;

  stroke-width: 2;

  vector-effect: non-scaling-stroke;

  paint-order: stroke fill;

  filter:
    drop-shadow(
      2px 3px 2px rgba(0,0,0,0.15)
    );
}


/* ================================
   T字ターゲット
   ================================ */

#target {

  fill: none;

  stroke: #777;

  stroke-width: 4;

  stroke-dasharray: 12 8;

  vector-effect: non-scaling-stroke;

  pointer-events: none;

  display: none;
}


/* ================================
   選択中のピース
   ================================ */

.piece.selected .shape {

  stroke-width: 5;

  stroke-linejoin: round;

  vector-effect: non-scaling-stroke;
}

.piece.selected#red .shape {

  stroke: #FF0000;
}

.piece.selected#blue .shape {

  stroke: #0000FF;
}

.piece.selected#green .shape {

  stroke: #00AA00;
}

.piece.selected#yellow .shape {

  stroke: #FFD700;
}


/* ================================
   Instagramリンク
   ================================ */

#instagramLink {

  position: fixed;

  left: 50%;

  bottom: 8px;

  transform: translateX(-50%);

  z-index: 99999;

  display: flex;

  flex-direction: column;

  align-items: center;

  text-decoration: none;

  color: #34505F;

  touch-action: manipulation;

  -webkit-tap-highlight-color: transparent;
}


/* Instagramの文字 */

#instagramText {

  font-size: 13px;

  font-weight: 700;

  margin-bottom: 2px;

  white-space: nowrap;
}


/* TAP HERE画像 */

#tapHere {

  width: 105px;

  height: auto;

  display: block;

  user-select: none;

  -webkit-user-select: none;

  -webkit-user-drag: none;
}


/* タップしたとき */

#instagramLink:active {

  opacity: 0.65;
}

</style>

</head>


<body>


<h1>Tパズル</h1>


<div id="message">
  4つのピースを組み合わせて、Tの形を作ろう!
</div>


<div id="hint">
  タップで回転、ダブルタップで左右反転
</div>


<div id="wrap">

<svg id="board" viewBox="0 0 750 1050">


  <!-- ================================
       完成位置のT字枠
       ================================ -->

  <path
    id="target"
    d="M55 330 H685 V537 H484 V920 H264 V537 H55 Z"
  />


  <!-- ================================
       青ピース
       ================================ -->

  <g id="blue" class="piece">

    <g class="flip">

      <g class="rotate">

        <path
          class="shape"
          d="M0 0 H280 L97 183 H0 Z"
          fill="#64B5F6"
        />

      </g>

    </g>

  </g>


  <!-- ================================
       緑ピース
       ================================ -->

  <g id="green" class="piece">

    <g class="flip">

      <g class="rotate">

        <path
          class="shape"
          d="M183 0 V183 H0 Z"
          fill="#81C784"
        />

      </g>

    </g>

  </g>


  <!-- ================================
       黄色ピース
       ================================ -->

  <g id="yellow" class="piece">

    <g class="flip">

      <g class="rotate">

        <path
          class="shape"
          d="M0 183 L183 0 H464 L281 183 L98 366 H98 V183 Z"
          fill="#FFF2A6"
        />

      </g>

    </g>

  </g>


  <!-- ================================
       赤ピース
       ================================ -->

  <g id="red" class="piece">

    <g class="flip">

      <g class="rotate">

        <path
          class="shape"
          d="M183 0 V366 H0 V183 Z"
          fill="#E57373"
        />

      </g>

    </g>

  </g>


  <!-- ================================
       操作ボタン
       ================================ -->

  <g id="controls" font-family="sans-serif">


    <!-- ヒントボタン
         少し下へ移動 -->

    <g
      id="hintButton"
      style="cursor:pointer"
    >

      <rect
        x="250"
        y="80"
        width="250"
        height="58"
        rx="14"
        fill="#ffffff"
        stroke="#9CCFE8"
        stroke-width="3"
      />

      <text
        x="375"
        y="117"
        text-anchor="middle"
        font-size="24"
        font-weight="700"
        fill="#333"
      >
        ヒントを表示する
      </text>

    </g>


    <!-- リセット -->

    <g
      id="resetButton"
      style="cursor:pointer"
    >

      <rect
        x="585"
        y="10"
        width="110"
        height="58"
        rx="14"
        fill="#ffffff"
        stroke="#9CCFE8"
        stroke-width="3"
      />

      <text
        x="640"
        y="47"
        text-anchor="middle"
        font-size="22"
        font-weight="700"
        fill="#333"
      >
        リセット
      </text>

    </g>


  </g>


</svg>

</div>


<!-- ================================
     Instagram
     TAP HEREをタップしてInstagramへ
     ================================ -->

<a
  id="instagramLink"
  href="https://www.instagram.com/mocataro_asobo/"
  target="_blank"
  rel="noopener noreferrer"
>

  <div id="instagramText">
    📷 mocataroのInstagramはこちら
  </div>

  <img
    id="tapHere"
    src="https://jun-n4270.github.io/mocataro/images/Taphere.png"
    alt="TAP HERE"
    draggable="false"
  >

</a>


<script>

const svg =
  document.getElementById("board");


const pieces = {

  // 初期配置
  blue: {
    x: 5,
    y: 650,
    cx: 140,
    cy: 91.5,
    angle: 45,
    flip: 1
  },

  green: {
    x: 600,
    y: 650,
    cx: 91.5,
    cy: 91.5,
    angle: 135,
    flip: 1
  },

  yellow: {
    x: 205,
    y: 200,
    cx: 232,
    cy: 183,
    angle: 225,
    flip: -1
  },

  red: {
    x: 285,
    y: 735,
    cx: 91.5,
    cy: 183,
    angle: 90,
    flip: -1
  }

};


let selected = null;

let drag = null;


const DOUBLE_TAP_MS = 280;

const MOVE_LIMIT = 8;


/* ================================
   ピース更新
   ================================ */

function updatePiece(id) {

  const el =
    document.getElementById(id);

  const flipGroup =
    el.querySelector(".flip");

  const rotateGroup =
    el.querySelector(".rotate");

  const p =
    pieces[id];


  /* 現在位置 */

  el.setAttribute(
    "transform",
    `translate(${p.x} ${p.y})`
  );


  /* 回転 */

  rotateGroup.setAttribute(

    "transform",

    `translate(${p.cx} ${p.cy})
     rotate(${p.angle})
     translate(${-p.cx} ${-p.cy})`

  );


  /* 左右反転 */

  flipGroup.setAttribute(

    "transform",

    `translate(${p.cx} ${p.cy})
     scale(${p.flip} 1)
     translate(${-p.cx} ${-p.cy})`

  );

}


Object.keys(pieces)
  .forEach(updatePiece);


/* ================================
   最前面へ
   ================================ */

function bringToFront(el) {

  svg.appendChild(el);

}


/* ================================
   座標変換
   ================================ */

function clientToSvg(e) {

  const pt =
    svg.createSVGPoint();

  pt.x =
    e.clientX;

  pt.y =
    e.clientY;

  const m =
    svg.getScreenCTM().inverse();

  return pt.matrixTransform(m);

}


/* ================================
   タッチ開始
   ================================ */

function pointerDown(e) {

  const el =
    e.currentTarget;

  const id =
    el.id;

  const p =
    pieces[id];


  const changedSelection =
    (selected !== id);


  if (
    selected &&
    selected !== id
  ) {

    document
      .getElementById(selected)
      .classList
      .remove("selected");

  }


  el.classList.add("selected");


  bringToFront(el);


  selected =
    id;


  const pt =
    clientToSvg(e);


  el._changedSelectionOnThisTouch =
    changedSelection;


  drag = {

    pointerId:
      e.pointerId,

    startX:
      pt.x,

    startY:
      pt.y,

    originalX:
      p.x,

    originalY:
      p.y,

    moved:
      false,

    downTime:
      performance.now()

  };


  el.setPointerCapture(
    e.pointerId
  );

}


/* ================================
   移動
   ================================ */

function pointerMove(e) {

  if (
    !drag ||
    drag.pointerId !== e.pointerId ||
    !selected
  ) {

    return;

  }


  const pt =
    clientToSvg(e);


  const dx =
    pt.x - drag.startX;

  const dy =
    pt.y - drag.startY;


  if (
    Math.hypot(dx, dy)
    >
    MOVE_LIMIT
  ) {

    drag.moved =
      true;

  }


  if (drag.moved) {

    const p =
      pieces[selected];


    p.x =
      drag.originalX + dx;

    p.y =
      drag.originalY + dy;


    updatePiece(selected);

  }

}


/* ================================
   タッチ終了
   ================================ */

function pointerUp(e) {

  if (
    !drag ||
    drag.pointerId !== e.pointerId ||
    !selected
  ) {

    return;

  }


  const el =
    document.getElementById(selected);


  const wasMoved =
    drag.moved;


  const now =
    performance.now();


  try {

    el.releasePointerCapture(
      e.pointerId
    );

  } catch (_) {}


  const id =
    selected;

  const p =
    pieces[id];


  if (!wasMoved) {


    /* 選択変更だけ */

    if (
      el._changedSelectionOnThisTouch
    ) {

      el._changedSelectionOnThisTouch =
        false;

      drag =
        null;

      return;

    }


    /* ================================
       タップ処理
       ================================ */

    if (
      el._tapTimer &&
      now - el._lastTap
      <
      DOUBLE_TAP_MS
    ) {


      clearTimeout(
        el._tapTimer
      );


      el._tapTimer =
        null;


      /* ダブルタップ
         → 左右反転 */

      p.flip *= -1;


      updatePiece(id);


      el._lastTap =
        0;


    } else {


      el._lastTap =
        now;


      /* シングルタップ */

      el._tapTimer =
        setTimeout(() => {


          el._tapTimer =
            null;


          /* 時計回り45度 */

          p.angle =
            (
              p.angle +
              (
                p.flip === -1
                  ? -45
                  : 45
              ) +
              360
            )
            %
            360;


          updatePiece(id);


        }, DOUBLE_TAP_MS);

    }

  }


  drag =
    null;

}


/* ================================
   ピースイベント
   ================================ */

Object.keys(pieces)
  .forEach(id => {

    const el =
      document.getElementById(id);


    el.addEventListener(
      "pointerdown",
      pointerDown
    );

    el.addEventListener(
      "pointermove",
      pointerMove
    );

    el.addEventListener(
      "pointerup",
      pointerUp
    );

    el.addEventListener(
      "pointercancel",
      pointerUp
    );

  });


/* ================================
   ヒント
   ================================ */

const target =
  document.getElementById("target");


const hintButton =
  document.getElementById("hintButton");


let hintTimer =
  null;


hintButton.addEventListener(
  "pointerdown",
  (e) => {

    e.preventDefault();


    target.style.display =
      "block";


    clearTimeout(
      hintTimer
    );


    hintTimer =
      setTimeout(() => {

        target.style.display =
          "none";

      }, 5000);

  }
);


/* ================================
   リセット
   ================================ */

const resetButton =
  document.getElementById(
    "resetButton"
  );


const initialPieces =
  JSON.parse(
    JSON.stringify(pieces)
  );


resetButton.addEventListener(
  "pointerdown",
  (e) => {

    e.preventDefault();


    clearTimeout(
      hintTimer
    );


    target.style.display =
      "none";


    if (selected) {

      document
        .getElementById(selected)
        .classList
        .remove("selected");

    }


    selected =
      null;


    Object.keys(initialPieces)
      .forEach(id => {

        pieces[id] =
          JSON.parse(
            JSON.stringify(
              initialPieces[id]
            )
          );


        document
          .getElementById(id)
          ._changedSelectionOnThisTouch =
          false;


        updatePiece(id);

      });

  }
);

</script>

</body>
</html>
