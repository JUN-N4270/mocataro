
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#EAF6FC">
<title>かけ算ダッシュ | mocataro</title>

<style>
:root {
  --bg: #EAF6FC;
  --text: #34505F;
  --border: #9CCFE8;
  --blue: #2689BD;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont,
    "Helvetica Neue", "Hiragino Kaku Gothic ProN",
    "Noto Sans JP", sans-serif;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
}

#app {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 16px;
}

header {
  text-align: center;
  flex: 0 0 auto;
}

h1 {
  font-size: clamp(22px, 4vw, 32px);
  font-weight: 900;
  margin: 0;
}

#game {
  flex: 1;
  width: 100%;
  max-width: 1000px;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

#equationBox {
  width: 100%;
  flex: 1;
  min-height: 120px;
  max-height: 55vh;
  max-height: 55dvh;
  background: white;
  border: 3px solid var(--border);
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
}

#equation {
  font-size: clamp(48px, 12vw, 100px);
  line-height: 1.1;
  font-weight: 900;
  text-align: center;
  white-space: nowrap;
  visibility: hidden;
}

#equation.show {
  visibility: visible;
  animation: pop .16s ease-out;
}

@keyframes pop {
  from {
    transform: scale(.8);
    opacity: .2;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

#progress {
  font-size: 15px;
  font-weight: 800;
  min-height: 20px;
}

button {
  width: min(320px, 90%);
  border: 0;
  border-radius: 14px;
  padding: 13px 20px;
  background: var(--blue);
  color: white;
  font-size: 19px;
  font-weight: 900;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

#startScreen,
#resultScreen {
  position: fixed;
  inset: 0;
  z-index: 5;
  background: rgba(234,246,252,.97);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.modal {
  width: 100%;
  max-width: 420px;
  background: white;
  border: 2px solid var(--border);
  border-radius: 24px;
  padding: 25px 20px;
  text-align: center;
}

.modal h2 {
  font-size: 27px;
  margin: 0 0 12px;
}

.modal p {
  font-size: 15px;
  line-height: 1.8;
}

.hidden {
  display: none !important;
}

#resultText {
  font-size: 18px;
  font-weight: 800;
  line-height: 1.8;
}

.instagram {
  flex: 0 0 auto;
  text-align: center;
  margin-top: 8px;
  margin-bottom: 2px;
}

.instagram-text {
  font-size: 13px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 2px;
}

#instagramLink {
  display: block;
  width: min(260px, 85%);
  margin: 0 auto;
  text-align: center;
  text-decoration: none;
}

#instagramLink img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}

@media (orientation: landscape) {
  #app {
    padding: 5px 20px;
  }

  header {
    margin-bottom: 2px;
  }

  #game {
    gap: 7px;
  }

  #equationBox {
    max-height: 58dvh;
    border-radius: 20px;
  }

  #progress {
    min-height: 18px;
  }

  .instagram {
    margin-top: 2px;
  }

  #instagramLink {
    width: 150px;
  }

  .instagram-text {
    font-size: 12px;
    margin-bottom: 0;
  }
}

@media (max-height: 420px) {
  #app {
    padding: 3px 12px;
  }

  h1 {
    font-size: 20px;
  }

  #game {
    gap: 4px;
  }

  #equationBox {
    min-height: 80px;
    max-height: 55dvh;
    border-width: 2px;
  }

  #progress {
    font-size: 12px;
  }

  .instagram {
    margin: 0;
  }

  #instagramLink {
    width: 110px;
  }

  .instagram-text {
    font-size: 10px;
  }

  button {
    padding: 9px 16px;
    font-size: 16px;
  }
}
</style>
</head>

<body>
<div id="app">

  <header>
    <h1>⚡ かけ算ダッシュ！</h1>
  </header>

  <main id="game">
    <div id="equationBox">
      <div id="equation"></div>
    </div>

    <div id="progress">全24問</div>
  </main>

  <div class="instagram">
    <div class="instagram-text">モカタロのインスタはこちら↓</div>
    <a
      id="instagramLink"
      href="https://www.instagram.com/mocataro_asobo/"
      target="_blank"
      rel="noopener"
      aria-label="mocataro Instagram"
    >
      <img
        src="https://jun-n4270.github.io/mocataro/images/Taphere.PNG"
        alt="TAP HERE"
      >
    </a>
  </div>

</div>

<div id="startScreen">
  <div class="modal">
    <h2>⚡ かけ算ダッシュ！</h2>
    <p>
      7・8・9の段から全24問！<br>
      式がランダムに出現して、ランダムに消える。<br>
      同じ答えになる逆順の式は出ないよ。
    </p>
    <button id="beginButton">スタート！</button>
  </div>
</div>

<div id="resultScreen" class="hidden">
  <div class="modal">
    <h2>🎉 全問終了！</h2>
    <div id="resultText">全24問終了！</div>
    <button id="retryButton">もう一度遊ぶ</button>
  </div>
</div>

<script>
"use strict";

const TOTAL_QUESTIONS = 24;

// 式の表示時間：1〜3秒
const DISPLAY_MIN = 1000;
const DISPLAY_MAX = 3000;

// 次の式までの待ち時間：2〜7秒
const WAIT_MIN = 2000;
const WAIT_MAX = 7000;

const equationEl = document.getElementById("equation");
const progressEl = document.getElementById("progress");
const startScreen = document.getElementById("startScreen");
const resultScreen = document.getElementById("resultScreen");
const beginButton = document.getElementById("beginButton");
const retryButton = document.getElementById("retryButton");
const resultText = document.getElementById("resultText");

let questions = [];
let currentIndex = 0;
let running = false;
let timerId = null;
let gameId = 0;
let audioContext = null;

// ピローン♪ 音をブラウザ内で生成
function playPiroon() {
  try {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return;

    if (!audioContext) {
      audioContext = new AudioContextClass();
    }

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    const now = audioContext.currentTime;

    // 2つの音をつなげて、明るい「ピローン♪」
    const notes = [
      { frequency: 880, start: 0, duration: 0.13 },
      { frequency: 1320, start: 0.12, duration: 0.32 }
    ];

    notes.forEach(note => {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(
        note.frequency,
        now + note.start
      );

      gain.gain.setValueAtTime(0.0001, now + note.start);
      gain.gain.exponentialRampToValueAtTime(
        0.22,
        now + note.start + 0.025
      );
      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + note.start + note.duration
      );

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start(now + note.start);
      oscillator.stop(now + note.start + note.duration + 0.02);
    });
  } catch (error) {
    // 音声が利用できない環境でもゲームは続行
    console.warn("音声を再生できませんでした。", error);
  }
}

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// 7・8・9の段から、逆順重複を除いた24問を作る
function makeQuestions() {
  const pool = [];

  for (let a = 7; a <= 9; a++) {
    for (let b = 1; b <= 9; b++) {
      // 7×8と8×7、7×9と9×7、8×9と9×8を除外
      if (b >= 7 && a > b) continue;

      pool.push({ a, b });
    }
  }

  // Fisher–Yates シャッフル
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }

  // 24問すべて出題
  return pool;
}

function clearTimer() {
  if (timerId !== null) {
    clearTimeout(timerId);
    timerId = null;
  }
}

function hideEquation() {
  equationEl.classList.remove("show");
  equationEl.textContent = "";
}

function startGame() {
  clearTimer();

  gameId++;
  const thisGame = gameId;

  questions = makeQuestions();
  currentIndex = 0;
  running = true;

  startScreen.classList.add("hidden");
  resultScreen.classList.add("hidden");

  hideEquation();
  progressEl.textContent = `全${TOTAL_QUESTIONS}問`;

  scheduleQuestion(thisGame);
}

function scheduleQuestion(thisGame) {
  if (!running || thisGame !== gameId) return;

  hideEquation();

  if (currentIndex >= TOTAL_QUESTIONS) {
    finishGame();
    return;
  }

  const wait = randomInt(WAIT_MIN, WAIT_MAX);

  timerId = setTimeout(() => {
    timerId = null;

    if (!running || thisGame !== gameId) return;

    showQuestion(thisGame);
  }, wait);
}

function showQuestion(thisGame) {
  if (!running || thisGame !== gameId) return;

  if (currentIndex >= TOTAL_QUESTIONS) {
    finishGame();
    return;
  }

  const q = questions[currentIndex];

  equationEl.textContent = `${q.a} × ${q.b}`;
  equationEl.classList.remove("show");

  // 毎回アニメーションを再実行
  void equationEl.offsetWidth;
  equationEl.classList.add("show");

  progressEl.textContent =
    `${currentIndex + 1} / ${TOTAL_QUESTIONS} 問`;

  // 式が表示された瞬間に音を鳴らす
  playPiroon();

  const displayTime = randomInt(DISPLAY_MIN, DISPLAY_MAX);

  timerId = setTimeout(() => {
    timerId = null;

    if (!running || thisGame !== gameId) return;

    hideEquation();
    currentIndex++;

    if (currentIndex >= TOTAL_QUESTIONS) {
      finishGame();
    } else {
      scheduleQuestion(thisGame);
    }
  }, displayTime);
}

function finishGame() {
  clearTimer();
  running = false;
  hideEquation();

  progressEl.textContent =
    `${TOTAL_QUESTIONS} / ${TOTAL_QUESTIONS} 問`;

  resultText.textContent = `全${TOTAL_QUESTIONS}問終了！`;
  resultScreen.classList.remove("hidden");
}

beginButton.addEventListener("click", startGame);
retryButton.addEventListener("click", startGame);
</script>
</body>
</html>
