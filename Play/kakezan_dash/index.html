
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#EAF6FC">
<title>かけ算ダッシュ | mocataro</title>

<style>
:root {
  --bg: #EAF6FC;
  --text: #34505F;
  --border: #9CCFE8;
  --blue: #2689BD;
  --red: #E76F8A;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 10px;
  -webkit-tap-highlight-color: transparent;
}

.app {
  width: min(100%, 520px);
  height: calc(100dvh - 20px);
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 14px;
  background: #fff;
  border: 2px solid var(--border);
  border-radius: 20px;
}

h1 {
  margin: 0;
  font-size: 20px;
  text-align: center;
}

#startBtn {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 14px;
  font-size: 20px;
  font-weight: 900;
  color: #fff;
  background: var(--blue);
  box-shadow: 0 4px 0 #17658e;
  cursor: pointer;
}

#startBtn:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #17658e;
}

#startBtn:disabled {
  opacity: 0.6;
}

.stage {
  position: relative;
  flex: 1;
  min-height: 0;
}

.game {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.player {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 14px;
  background: #F2F9FD;
  border: 1px solid var(--border);
  overflow: hidden;
}

.display {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  font-weight: 1000;
  font-size: clamp(80px, 24vw, 150px);
  line-height: 1;
  color: var(--text);
  text-align: center;
  white-space: nowrap;
}

/* 対面する人側 */
.player.top .display {
  transform: rotate(180deg);
}

/* 中央の問題表示 */
.arrow-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

#equationDisplay {
  display: flex;
  align-items: center;
  justify-content: center;
  width: min(88vw, 430px);
  min-height: 150px;
  padding: 16px 8px;
  font-size: clamp(48px, 12vw, 76px);
  font-weight: 1000;
  line-height: 1.1;
  color: white;
  background: var(--blue);
  border-radius: 26px;
  user-select: none;
  white-space: nowrap;
}

#equationDisplay.blank {
  background: transparent;
  color: transparent;
}

#equationDisplay.done {
  background: #fff;
  color: var(--text);
  border: 2px solid var(--border);
  font-size: 72px;
}

@media (max-height: 650px) {
  .app {
    gap: 8px;
    padding: 10px;
  }

  h1 {
    font-size: 17px;
  }

  #startBtn {
    padding: 10px;
  }

  #equationDisplay {
    min-height: 110px;
    font-size: clamp(40px, 10vw, 60px);
  }
}
</style>
</head>

<body>
<main class="app">

  <h1>かけ算ダッシュ</h1>

  <button id="startBtn">スタート</button>

  <section class="stage">

    <div class="game">

      <div class="player top">
        <div class="display" id="topDisplay">3</div>
      </div>

      <div class="player bottom">
        <div class="display" id="bottomDisplay">3</div>
      </div>

    </div>

    <div class="arrow-overlay">
      <div id="equationDisplay" class="blank"></div>
    </div>

  </section>
</main>

<script>
(() => {
  // 1ゲーム10問
  const TOTAL = 10;

  // 式の表示時間：1〜3秒
  const MIN_SHOW = 1000;
  const MAX_SHOW = 3000;

  // 式が消えている時間：1〜3秒
  const MIN_WAIT = 1000;
  const MAX_WAIT = 3000;

  const startBtn = document.getElementById("startBtn");
  const topDisplay = document.getElementById("topDisplay");
  const bottomDisplay = document.getElementById("bottomDisplay");
  const equationDisplay = document.getElementById("equationDisplay");

  let timers = [];
  let running = false;
  let index = 0;
  let questions = [];

  function clearTimers() {
    timers.forEach(clearTimeout);
    timers = [];
  }

  function later(fn, ms) {
    timers.push(setTimeout(fn, ms));
  }

  // 上下にカウントダウンを表示
  function showCountdown(value) {
    topDisplay.textContent = value;
    bottomDisplay.textContent = value;

    topDisplay.style.visibility = "visible";
    bottomDisplay.style.visibility = "visible";

    equationDisplay.className = "blank";
    equationDisplay.textContent = "";
  }

  // 問題を中央に1つだけ表示
  function showEquation(question) {
    topDisplay.style.visibility = "hidden";
    bottomDisplay.style.visibility = "hidden";

    equationDisplay.className = "";
    equationDisplay.textContent =
      `${question.a} × ${question.b}`;
  }

  // 問題を消す
  function showBlank() {
    topDisplay.style.visibility = "hidden";
    bottomDisplay.style.visibility = "hidden";

    equationDisplay.className = "blank";
    equationDisplay.textContent = "";
  }

  // 7・8・9の段から候補を作成
  // a <= b に統一し、7×8と8×7などの重複を防ぐ
  function makeQuestions() {
    const pool = [];

    for (let a = 1; a <= 9; a++) {
      for (let b = a; b <= 9; b++) {

        // 少なくとも一方の数字が7・8・9
        if (a >= 7 || b >= 7) {
          pool.push({ a, b });
        }
      }
    }

    // 候補をランダムにシャッフル
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }

    // 重複なしで10問選ぶ
    return pool.slice(0, TOTAL);
  }

  // 終了
  function finish() {
    running = false;

    topDisplay.style.visibility = "hidden";
    bottomDisplay.style.visibility = "hidden";

    equationDisplay.className = "done";
    equationDisplay.textContent = "✓";

    startBtn.disabled = false;
    startBtn.textContent = "もう一度スタート";
  }

  // 次の問題
  function next() {
    if (!running) return;

    if (index >= TOTAL) {
      finish();
      return;
    }

    const question = questions[index];
    index++;

    showEquation(question);

    // 問題の表示時間をランダムに決定
    const showTime =
      MIN_SHOW + Math.random() * (MAX_SHOW - MIN_SHOW);

    later(() => {
      if (!running) return;

      if (index >= TOTAL) {
        finish();
        return;
      }

      // 問題を消す
      showBlank();

      // 次の問題までの待ち時間をランダムに決定
      const waitTime =
        MIN_WAIT + Math.random() * (MAX_WAIT - MIN_WAIT);

      later(next, waitTime);

    }, showTime);
  }

  // スタート
  function start() {
    clearTimers();

    running = true;
    index = 0;

    // 毎回、新しい10問を選ぶ
    questions = makeQuestions();

    startBtn.disabled = true;
    startBtn.textContent = "プレイ中…";

    showCountdown("3");

    later(() => {
      if (running) showCountdown("2");
    }, 700);

    later(() => {
      if (running) showCountdown("1");
    }, 1400);

    // カウントダウン終了後、最初の問題まで1〜3秒待つ
    later(() => {
      if (!running) return;

      showBlank();

      const waitTime =
        MIN_WAIT + Math.random() * (MAX_WAIT - MIN_WAIT);

      later(next, waitTime);

    }, 2100);
  }

  startBtn.addEventListener("click", start);

  showCountdown("3");

})();
</script>
</body>
</html>
