<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>カラフル棒を動かしてみよう!</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#ECF6FB;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;
  color:#263746;
}

#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  background:#ECF6FB;
}

header{
  flex:0 0 auto;
  text-align:center;
  padding:12px 12px 0;
}

h1{
  margin:0;
  color:#111;
  font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    serif;
  font-size:28px;
  font-weight:700;
  line-height:48px;
}

.controls{
  flex:0 0 auto;
  padding:8px 18px 0;
}

.row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:9px;
}

.row label{
  color:#111;
  font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    serif;
  font-size:16px;
  white-space:nowrap;
}

#numberField{
  width:72px;
  height:42px;
  border:2px solid #A9D3E9;
  border-radius:12px;
  background:#fff;
  color:#222;
  text-align:center;
  font-size:17px;
  outline:none;
}

button{
  height:42px;
  border:2px solid #A9D3E9;
  border-radius:13px;
  background:#fff;
  color:#222;
  font-size:16px;
  font-weight:700;
  padding:0 15px;
  touch-action:manipulation;
  box-shadow:none;
}

button:active{
  background:#F3FAFD;
  transform:scale(.98);
}

#makeButton{
  width:140px;
}

#addButton,
#removeButton,
#ballButton,
#removeBall{
  width:140px;
  min-width:140px;
  max-width:140px;
  flex:0 0 140px;
}




#info{
  flex:0 0 auto;
  text-align:center;
  margin:0 10px 2px;
  color:#6F9BB0;
  font-size:15px;
  line-height:1.4;
  white-space:nowrap;
}

#matchArea{z-index:1;
  position:relative;
  flex:1 1 auto;
  margin:0;
  overflow:hidden;
  background:transparent;
  touch-action:none;
}

#canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
  overflow:visible;
}

/* Tパズルと同じ系統の輪郭 */
.match-body{
  stroke:#34505F;
  stroke-width:19;
  stroke-linecap:round;
  fill:none;
}

.match-color{
  stroke-linecap:round;
  fill:none;
}

.selected-outline{
  stroke:#FFFFFF;
  stroke-width:25;
  stroke-linecap:round;
  fill:none;
  opacity:.95;
}

.connection{
  fill:#34505F;
  opacity:.18;
}

.medal-emoji{
  pointer-events:none;
  user-select:none;
}
.medal-selection{
  fill:none;
  stroke:#FFD84D;
  stroke-width:3;
}

#footer{
  flex:0 0 auto;
  text-align:center;
  padding:5px 0 10px;
}

#instagramText{
  margin:0 0 5px;
  color:#34505F;
  font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    serif;
  font-size:16px;
  font-weight:700;
}

#tapHereLink{
  display:block;
  width:max-content;
  margin:0 auto;
  line-height:0;
}

#tapHere{
  display:block;
  width:126px;
  height:auto;
  cursor:pointer;
  user-select:none;
}



@media(max-width:600px){
  .row{
    gap:6px;
  }

  .row:nth-child(2){
    width:100%;
  }

  #addButton,
  #removeButton,
  #ballButton,
  #removeBall{
    width:calc((100vw - 48px) / 4);
    min-width:0;
    max-width:none;
    flex:1 1 0;
    padding:0 2px;
    font-size:14px;
    white-space:normal;
    line-height:1.15;
  }
}

#orientationWarning{
  display:none;
}

@media (orientation:landscape){
  #orientationWarning{
    position:fixed;
    inset:0;
    z-index:99999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#ECF6FB;
    padding:24px;
    text-align:center;
  }

  .orientation-card{
    width:min(88vw,520px);
    padding:28px 22px;
    background:#fff;
    border:3px solid #A9D3E9;
    border-radius:24px;
    box-shadow:0 8px 30px rgba(52,80,95,.15);
  }

  .orientation-icon{
    font-size:58px;
    line-height:1;
    margin-bottom:14px;
  }

  .orientation-title{
    color:#34505F;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:26px;
    font-weight:700;
    margin-bottom:10px;
  }

  .orientation-text{
    color:#6F9BB0;
    font-size:16px;
    line-height:1.6;
  }
}
</style>
</head>
<body>

<div id="orientationWarning" aria-hidden="true">
  <div class="orientation-card">
    <div class="orientation-icon">📱</div>
    <div class="orientation-title">縦画面にして遊んでね！</div>
    <div class="orientation-text">このゲームは縦向きで遊ぶのがおすすめです。</div>
  </div>
</div>
<div id="app">
<header><h1>カラフル棒を動かしてみよう!</h1></header>

<div class="controls">
  <div class="row">
    <label for="numberField">棒の本数</label>
    <input id="numberField" type="number" inputmode="numeric" min="0" max="100" value="10">
    <button id="makeButton">作り直す</button>
  </div>

  <div class="row">
    <button id="addButton">＋ 1本</button>
    <button id="removeButton">− 1本</button>
    <button id="ballButton">🪙 メダル追加</button>
    <button id="removeBall">🪙 メダル削除</button>
  </div>
</div>


<div id="info">棒をタップで回転、指でつかんで動かせます</div>

<div id="matchArea"><svg id="canvas"></svg></div>

<div id="footer">
  <p id="instagramText">📱 mocataroのInstagramはこちら↓↓</p>
  <a
    id="tapHereLink"
    href="https://www.instagram.com/mocataro_asobo/"
  >
    <img
      id="tapHere"
      src="https://jun-n4270.github.io/mocataro/images/Taphere.PNG"
      alt="Tap here"
    >
  </a>
</div>

</div>

<script>
const STICK_COLORS=["#FF5A5F","#4A90E2","#FFD23F","#3FA65C","#A66DD4","#FF8A3D","#20B8A6","#F05DA2"];

class Matchstick{
  constructor(x,y,length=90,angle=0,color="#4A90E2"){
    this.x=x;this.y=y;this.length=length;this.angle=angle;this.color=color;
  }
  connectionPoints(){
    const r=this.angle*Math.PI/180;
    const dx=Math.cos(r)*this.length/2;
    const dy=Math.sin(r)*this.length/2;
    return [[this.x-dx,this.y-dy],[this.x,this.y],[this.x+dx,this.y+dy]];
  }
  points(){
    const p=this.connectionPoints();
    return [p[0][0],p[0][1],p[2][0],p[2][1]];
  }
}

class Ball{
  constructor(x,y,radius=20){
    this.x=x;this.y=y;this.radius=radius;
  }
}

function svgEl(name){
  return document.createElementNS("http://www.w3.org/2000/svg",name);
}

class MatchstickView{
  constructor(svg){
    this.svg=svg;
    this.matchsticks=[];
    this.balls=[];
    this.selected=null;
    this.selectedType=null;
    this.dragStart=null;
    this.original=null;
    this.snapDistance=25;
    this.dragging=false;
    this.bindEvents();
  }

  getPoint(e){
    const r=this.svg.getBoundingClientRect();
    return {x:e.clientX-r.left,y:e.clientY-r.top};
  }

  render(){
    this.svg.replaceChildren();

    this.matchsticks.forEach((m,i)=>{
      const g=svgEl("g");
      const [x1,y1,x2,y2]=m.points();

      if(this.selectedType==="match"&&i===this.selected){
        const s=svgEl("line");
        s.setAttribute("x1",x1);s.setAttribute("y1",y1);
        s.setAttribute("x2",x2);s.setAttribute("y2",y2);
        s.setAttribute("class","selected-outline");
        g.appendChild(s);
      }

      const outline=svgEl("line");
      outline.setAttribute("x1",x1);outline.setAttribute("y1",y1);
      outline.setAttribute("x2",x2);outline.setAttribute("y2",y2);
      outline.setAttribute("class","match-body");
      g.appendChild(outline);

      const line=svgEl("line");
      line.setAttribute("x1",x1);line.setAttribute("y1",y1);
      line.setAttribute("x2",x2);line.setAttribute("y2",y2);
      line.setAttribute("class","match-color");
      line.setAttribute("stroke",m.color);
      line.setAttribute("stroke-width","14");
      g.appendChild(line);

      for(const [cx,cy] of [[x1,y1],[x2,y2]]){
        const c=svgEl("circle");
        c.setAttribute("cx",cx);c.setAttribute("cy",cy);
        c.setAttribute("r",7);
        c.setAttribute("class","match-head");
        c.setAttribute("fill",m.color);
        g.appendChild(c);
      }

      for(const [cx,cy] of m.connectionPoints()){
        const c=svgEl("circle");
        c.setAttribute("cx",cx);c.setAttribute("cy",cy);
        c.setAttribute("r",4);c.setAttribute("class","connection");
        g.appendChild(c);
      }

      g.dataset.type="match";
      g.dataset.index=i;
      this.svg.appendChild(g);
    });

    this.balls.forEach((b,i)=>{
      const g=svgEl("g");
      g.dataset.type="ball";g.dataset.index=i;

      if(this.selectedType==="ball"&&i===this.selected){
        const sel=svgEl("circle");
        sel.setAttribute("cx",b.x);sel.setAttribute("cy",b.y);
        sel.setAttribute("r",25);sel.setAttribute("class","medal-selection");
        g.appendChild(sel);
      }

      const medal=svgEl("text");
      medal.setAttribute("x",b.x);
      medal.setAttribute("y",b.y);
      medal.setAttribute("text-anchor","middle");
      medal.setAttribute("dominant-baseline","central");
      medal.setAttribute("font-size","42");
      medal.setAttribute("font-family","Apple Color Emoji, Segoe UI Emoji, sans-serif");
      medal.setAttribute("class","medal-emoji");
      medal.textContent="🪙";
      g.appendChild(medal);

      this.svg.appendChild(g);
    });
  }

  hitMatchstick(x,y){
    let best=null,bestDist=35;
    this.matchsticks.forEach((m,i)=>{
      const [x1,y1,x2,y2]=m.points();
      const dx=x2-x1,dy=y2-y1;
      let dist;
      if(dx===0&&dy===0){
        dist=Math.hypot(x-x1,y-y1);
      }else{
        let t=((x-x1)*dx+(y-y1)*dy)/(dx*dx+dy*dy);
        t=Math.max(0,Math.min(1,t));
        const px=x1+t*dx,py=y1+t*dy;
        dist=Math.hypot(x-px,y-py);
      }
      if(dist<bestDist){bestDist=dist;best=i;}
    });
    return best;
  }

  hitBall(x,y){
    for(let i=this.balls.length-1;i>=0;i--){
      const b=this.balls[i];
      if(Math.hypot(x-b.x,y-b.y)<=b.radius+10)return i;
    }
    return null;
  }

  pointerDown(e){
    e.preventDefault();
    const {x,y}=this.getPoint(e);

    const ball=this.hitBall(x,y);
    if(ball!==null){
      this.selected=ball;this.selectedType="ball";
      const b=this.balls[ball];
      this.dragStart=[x,y];this.original=[b.x,b.y];
      this.dragging=true;
      this.svg.setPointerCapture?.(e.pointerId);
      this.render();
      return;
    }

    const match=this.hitMatchstick(x,y);
    this.selected=match;

    if(match!==null){
      this.selectedType="match";
      const m=this.matchsticks[match];
      this.dragStart=[x,y];this.original=[m.x,m.y];
      this.dragging=true;
      this.svg.setPointerCapture?.(e.pointerId);
    }else{
      this.selectedType=null;
      this.dragging=false;
    }
    this.render();
  }

  pointerMove(e){
    if(!this.dragging||this.selected===null)return;
    e.preventDefault();
    const {x,y}=this.getPoint(e);
    const [sx,sy]=this.dragStart;

    if(this.selectedType==="ball"){
      const b=this.balls[this.selected];
      b.x=this.original[0]+x-sx;
      b.y=this.original[1]+y-sy;
    }else{
      const m=this.matchsticks[this.selected];
      m.x=this.original[0]+x-sx;
      m.y=this.original[1]+y-sy;
      this.snapConnection(this.selected);
    }
    this.render();
  }

  pointerUp(e){
    if(this.selectedType==="match"&&this.selected!==null){
      this.snapConnection(this.selected);
    }
    this.dragging=false;
    try{this.svg.releasePointerCapture?.(e.pointerId)}catch(_){}
    this.render();
  }

  snapConnection(index){
    if(index===null||index===undefined)return;

    const target=this.matchsticks[index];
    let targetPoints=target.connectionPoints();
    let bestDistance=this.snapDistance;
    let bestTarget=null,bestSource=null;

    for(let j=0;j<this.matchsticks.length;j++){
      if(j===index)continue;
      const otherPoints=this.matchsticks[j].connectionPoints();

      for(let si=0;si<targetPoints.length;si++){
        const [sx,sy]=targetPoints[si];

        for(const [tx,ty] of otherPoints){
          const d=Math.hypot(sx-tx,sy-ty);
          if(d<bestDistance){
            bestDistance=d;
            bestSource=si;
            bestTarget=[tx,ty];
          }
        }
      }
    }

    if(bestTarget!==null){
      let [sx,sy]=targetPoints[bestSource];
      const [tx,ty]=bestTarget;

      target.x+=tx-sx;
      target.y+=ty-sy;

      target.angle=Math.round(target.angle/45)*45;
      target.angle%=360;

      targetPoints=target.connectionPoints();
      [sx,sy]=targetPoints[bestSource];

      target.x+=tx-sx;
      target.y+=ty-sy;
    }
  }

  rotateSelected(){
    if(this.selectedType!=="match"||this.selected===null)return;
    const m=this.matchsticks[this.selected];
    m.angle=(m.angle+45)%360;
    this.snapConnection(this.selected);
    this.render();
  }

  addMatchstick(){
    const i=this.matchsticks.length;
    const col=i%5,row=Math.floor(i/5);
    const x=55+col*90,y=60+row*70;
    const angle=i%2===0?0:90;
    this.matchsticks.push(new Matchstick(x,y,75,angle,STICK_COLORS[i%STICK_COLORS.length]));
    this.selected=i;this.selectedType="match";
    this.render();
  }

  removeMatchstick(){
    if(this.matchsticks.length===0)return;

    if(this.selectedType==="match"&&this.selected!==null){
      this.matchsticks.splice(this.selected,1);
    }else{
      this.matchsticks.pop();
    }

    this.selected=null;this.selectedType=null;
    this.render();
  }

  addBall(){
    const i=this.balls.length;
    const x=80+(i%5)*80;
    const y=60+Math.floor(i/5)*70;
    this.balls.push(new Ball(x,y,20));
    this.selected=i;this.selectedType="ball";
    this.render();
  }

  makeMatchsticks(count){
    count=Math.max(0,Math.min(Number(count)||10,100));
    this.matchsticks=[];

    for(let i=0;i<count;i++){
      const col=i%5,row=Math.floor(i/5);
      const x=55+col*90,y=60+row*70;
      const angle=i%2===0?0:90;
      this.matchsticks.push(new Matchstick(x,y,75,angle,STICK_COLORS[i%STICK_COLORS.length]));
    }

    this.selected=null;this.selectedType=null;
    this.render();
  }

  bindEvents(){
    this.svg.addEventListener("pointerdown",e=>this.pointerDown(e));
    window.addEventListener("pointermove",e=>this.pointerMove(e),{passive:false});
    window.addEventListener("pointerup",e=>this.pointerUp(e));

    let tapStartTime=0,tapStartX=0,tapStartY=0;
    this.svg.addEventListener("pointerdown",e=>{tapStartTime=Date.now();tapStartX=e.clientX;tapStartY=e.clientY;});
    this.svg.addEventListener("pointerup",e=>{
      const dt=Date.now()-tapStartTime;
      const moved=Math.hypot(e.clientX-tapStartX,e.clientY-tapStartY);
      if(dt<250&&moved<8&&this.selectedType==="match"&&this.selected!==null)this.rotateSelected();
    });

    document.getElementById("makeButton").addEventListener("click",()=>{
      let n=parseInt(document.getElementById("numberField").value,10);
      if(Number.isNaN(n))n=10;
      this.makeMatchsticks(n);
    });

    document.getElementById("addButton").addEventListener("click",()=>{
      this.addMatchstick();
      document.getElementById("numberField").value=this.matchsticks.length;
    });

    document.getElementById("removeButton").addEventListener("click",()=>{
      this.removeMatchstick();
      document.getElementById("numberField").value=this.matchsticks.length;
    });

    document.getElementById("ballButton").addEventListener("click",()=>{
      this.addBall();
    });
  }
}


const matchView=new MatchstickView(document.getElementById("canvas"));
matchView.makeMatchsticks(10);

document.getElementById("removeBall").addEventListener("click",()=>{
  if(matchView.balls.length>0){
    matchView.balls.pop();
    matchView.selectedType=null;
    matchView.selected=null;
    matchView.render();
  }
});
</script>
</body>
</html>
