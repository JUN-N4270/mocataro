<html lang="ja">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ゲームで遊ぶ｜mocataro</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                "Hiragino Kaku Gothic ProN",
                "Yu Gothic",
                sans-serif;

            background: #EAF6FC;
            color: #34505F;
        }

        /* ================================
           ヘッダー
           ================================ */

        header {
            background: #78B9DD;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 34px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 14px;
        }

        /* ================================
           メイン
           ================================ */

        main {
            max-width: 900px;
            margin: auto;
            padding: 25px 15px 50px;
        }

        /* ================================
           戻る
           ================================ */

        .back {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #4D9BC7;
            font-weight: bold;
        }

        /* ================================
           ゲーム一覧
           ================================ */

        .games {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        /* ================================
           ゲームカード
           ================================ */

        .game {
            background: white;
            border-radius: 18px;
            padding: 25px 20px;

            box-shadow:
                0 4px 12px rgba(50,120,160,0.12);
        }

        .icon {
            font-size: 48px;
        }

        .game h2 {
            margin: 10px 0;
            font-size: 22px;
        }

        .game p {
            color: #607D8B;
            line-height: 1.6;
            min-height: 48px;
        }

        /* ================================
           あそぶボタン
           ================================ */

        .play {
            display: block;
            text-align: center;

            background: #4D9BC7;
            color: white;

            text-decoration: none;
            padding: 12px;
            border-radius: 10px;

            margin-top: 18px;

            font-weight: bold;
        }

        .play:hover {
            opacity: 0.8;
        }

        /* ================================
           フッター
           ================================ */

        footer {
            text-align: center;

            background: #4D9BC7;
            color: white;

            padding: 25px 15px;
            font-size: 13px;
        }

        /* ================================
           スマホ
           ================================ */

        @media (max-width: 600px) {

            .games {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<header>

    <h1>🎮 ゲームで遊ぶ</h1>

    <p>
        mocataroのゲームセンター
    </p>

</header>


<main>

    <a class="back" href="../index.html">
        ← mocataroトップへ
    </a>


    <div class="games">


        <!-- =========================================
             Horse Puzzle
             ========================================= -->

        <div class="game">

            <div class="icon">🐎</div>

            <h2>Horse Puzzle</h2>

            <p>
                馬と騎手のパズルで遊ぼう！
            </p>

            <a class="play" href="HorsePazzle/">
                あそぶ
            </a>

        </div>


        <!-- =========================================
             丸バツゲーム
             ========================================= -->

        <div class="game">

            <div class="icon">⭕️❌</div>

            <h2>⭕️❌ ゲームデラックス</h2>

            <p>
                めざせ！3つそろえ！
            </p>

            <a class="play" href="marubatu/">
                あそぶ
            </a>

        </div>


        

        <!-- =========================================
             100マス計算
             ========================================= -->

        <div class="game">

            <div class="icon">🔢</div>

            <h2>100マス計算</h2>

            <p>
                目指せ全問正解！
            </p>

            <a class="play" href="100masu/">
                あそぶ
            </a>

        </div>


    </div>

</main>


<footer>

    © mocataro

</footer>


</body>

</html>
