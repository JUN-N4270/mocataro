<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>⭕️❌ ゲームデラックス</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
    text-align: center;
    color: #333;
    overflow-x: hidden;
}

/* =========================================================
   タイトル
   ========================================================= */

h1 {
    margin: 8px 10px 0;
    font-size: 30px;
    color: #FF5A8A;
    font-weight: 700;
}

.subtitle {
    margin-top: 0;
    font-size: 15px;
    font-weight: 700;
    color: #777;
}

/* =========================================================
   状態表示
   ========================================================= */

#status {
    height: 45px;
    font-size: 21px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: pre-line;
}

/* =========================================================
   ゲーム盤
   ========================================================= */

#board {
    width: min(94vw, 540px);
    aspect-ratio: 1 / 1;

    margin: 15px auto 20px;

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);

    border: 4px solid black;
}

/* =========================================================
   大エリア
   ========================================================= */

.area {
    position: relative;

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);

    background: white;

    border-right: 4px solid black;
    border-bottom: 4px solid black;
}

/* 一番右 */
.area:nth-child(3n) {
    border-right: none;
}

/* 一番下 */
.area:nth-child(n+7) {
    border-bottom: none;
}

/* =========================================================
   次に置けるエリア
   ========================================================= */

.area.active {
    background: #FFF2A8;
}

/* =========================================================
   小マス
   ========================================================= */

.cell {
    display: flex;
    align-items: center;
    justify-content: center;

    border-right: 1px solid #aaa;
    border-bottom: 1px solid #aaa;

    cursor: pointer;
    user-select: none;

    font-size: clamp(25px, 8vw, 48px);
}

/* 3列目 */
.cell:nth-child(3n) {
    border-right: none;
}

/* 3段目 */
.cell:nth-child(n+7) {
    border-bottom: none;
}

.cell:active {
    background: rgba(0,0,0,0.08);
}

/* =========================================================
   ○
   ========================================================= */

.circle {
    width: 62%;
    height: 62%;

    border: 5px solid red;
    border-radius: 50%;
}

/* =========================================================
   ×
   ========================================================= */

.cross {
    position: relative;

    width: 65%;
    height: 65%;
}

.cross::before,
.cross::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 5px;
    height: 90%;

    background: blue;
    border-radius: 3px;
}

.cross::before {
    transform: translate(-50%, -50%) rotate(45deg);
}

.cross::after {
    transform: translate(-50%, -50%) rotate(-45deg);
}

/* =========================================================
   もう一度やる
   ========================================================= */

#reset {
    width: 50%;
    max-width: 270px;

    height: 45px;

    border: none;
    border-radius: 10px;

    background: #EEEEEE;

    font-size: 18px;
    font-weight: 700;

    color: #333;

    cursor: pointer;
}

#reset:active {
    transform: scale(0.96);
}

/* =========================================================
   勝利画面
   ========================================================= */

#winScreen {
    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    background: rgba(0,0,0,0.75);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 100;
}

#winMessage {
    color: white;

    font-size: 46px;
    font-weight: 700;

    line-height: 1.4;

    text-align: center;

    z-index: 102;
}

#winReset {
    position: absolute;

    left: 20%;
    width: 60%;

    bottom: 18%;

    height: 60px;

    border: none;
    border-radius: 12px;

    background: white;

    color: black;

    font-size: 22px;
    font-weight: 700;

    z-index: 102;
}

/* =========================================================
   キラキラ
   ========================================================= */

.sparkle {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    opacity: 0;

    font-size: 25px;

    pointer-events: none;

    z-index: 101;

    transition:
        left 0.8s ease,
        top 0.8s ease,
        opacity 0.8s ease;
}

</style>
</head>

<body>

<h1>⭕️❌ ゲームデラックス 🎉</h1>

<div class="subtitle">
    めざせ! 3つそろえ!
</div>

<div id="status">
    ○ の番です
</div>

<div id="board"></div>

<button id="reset">
    もう一度やる
</button>


<!-- =======================================================
     勝利画面
     ======================================================= -->

<div id="winScreen">

    <div id="winMessage"></div>

    <button id="winReset">
        もう一度やる
    </button>

</div>


<script>

/* =========================================================
   ゲームデータ
   ========================================================= */

let board = [];

let currentPlayer = "○";

let nextArea = null;

let gameOver = false;


/* =========================================================
   盤面初期化
   ========================================================= */

function createBoard() {

    board = [];

    for (let area = 0; area < 9; area++) {

        board.push(
            Array(9).fill(null)
        );

    }

}


/* =========================================================
   盤面描画
   ========================================================= */

function drawBoard() {

    const boardElement =
        document.getElementById("board");

    boardElement.innerHTML = "";

    for (let area = 0; area < 9; area++) {

        const areaElement =
            document.createElement("div");

        areaElement.className = "area";

        /* -------------------------------------------------
           次に置ける大エリアを黄色
           ------------------------------------------------- */

        if (
            nextArea !== null &&
            area === nextArea
        ) {

            areaElement.classList.add("active");

        }


        /* -------------------------------------------------
           小マス9個
           ------------------------------------------------- */

        for (let small = 0; small < 9; small++) {

            const cell =
                document.createElement("div");

            cell.className = "cell";

            const mark =
                board[area][small];


            /* ------------------------------------------------
               ○
               ------------------------------------------------ */

            if (mark === "○") {

                const circle =
                    document.createElement("div");

                circle.className = "circle";

                cell.appendChild(circle);

            }


            /* ------------------------------------------------
               ×
               ------------------------------------------------ */

            else if (mark === "×") {

                const cross =
                    document.createElement("div");

                cross.className = "cross";

                cell.appendChild(cross);

            }


            /* ------------------------------------------------
               タップ
               ------------------------------------------------ */

            cell.addEventListener(
                "click",
                function () {

                    placeMark(
                        area,
                        small
                    );

                }
            );


            areaElement.appendChild(cell);

        }


        boardElement.appendChild(
            areaElement
        );

    }

}


/* =========================================================
   マークを置く
   ========================================================= */

function placeMark(area, small) {

    /* ゲーム終了 */
    if (gameOver) {
        return;
    }


    /* -----------------------------------------------------
       指定された大エリアか
       ----------------------------------------------------- */

    if (
        nextArea !== null &&
        area !== nextArea
    ) {

        return;

    }


    /* -----------------------------------------------------
       使用済みなら無視
       ----------------------------------------------------- */

    if (board[area][small] !== null) {

        return;

    }


    /* -----------------------------------------------------
       ○ / × を置く
       ----------------------------------------------------- */

    board[area][small] =
        currentPlayer;


    /* -----------------------------------------------------
       3つ並んだ？
       ----------------------------------------------------- */

    if (
        checkSmallWinner(area)
    ) {

        gameOver = true;

        document.getElementById("status")
            .textContent =
            currentPlayer + " の勝ち!";

        drawBoard();

        showVictory();

        return;

    }


    /* -----------------------------------------------------
       次の大エリア
       
       今置いた小マスの番号が
       次に置ける大エリアになる
       ----------------------------------------------------- */

    nextArea = small;


    /* -----------------------------------------------------
       次の大エリアが満杯なら
       どこでもOK
       ----------------------------------------------------- */

    if (
        isAreaFull(nextArea)
    ) {

        nextArea = null;

    }


    /* -----------------------------------------------------
       プレイヤー交代
       ----------------------------------------------------- */

    if (currentPlayer === "○") {

        currentPlayer = "×";

    } else {

        currentPlayer = "○";

    }


    /* -----------------------------------------------------
       状態表示
       ----------------------------------------------------- */

    if (nextArea === null) {

        document.getElementById("status")
            .textContent =
            currentPlayer +
            " の番です\n" +
            "(どこでもOK)";

    } else {

        document.getElementById("status")
            .textContent =
            currentPlayer +
            " の番です";

    }


    drawBoard();

}


/* =========================================================
   小エリア勝敗判定
   ========================================================= */

function checkSmallWinner(area) {

    const b = board[area];


    /* -----------------------------------------------------
       横
       ----------------------------------------------------- */

    for (let row = 0; row < 3; row++) {

        const start = row * 3;

        if (
            b[start] !== null &&
            b[start] === b[start + 1] &&
            b[start] === b[start + 2]
        ) {

            return true;

        }

    }


    /* -----------------------------------------------------
       縦
       ----------------------------------------------------- */

    for (let col = 0; col < 3; col++) {

        if (
            b[col] !== null &&
            b[col] === b[col + 3] &&
            b[col] === b[col + 6]
        ) {

            return true;

        }

    }


    /* -----------------------------------------------------
       斜め
       ----------------------------------------------------- */

    if (
        b[0] !== null &&
        b[0] === b[4] &&
        b[0] === b[8]
    ) {

        return true;

    }


    if (
        b[2] !== null &&
        b[2] === b[4] &&
        b[2] === b[6]
    ) {

        return true;

    }


    return false;

}


/* =========================================================
   大エリアが満杯か
   ========================================================= */

function isAreaFull(area) {

    return board[area]
        .every(
            value => value !== null
        );

}


/* =========================================================
   勝利画面
   ========================================================= */

function showVictory() {

    const winScreen =
        document.getElementById(
            "winScreen"
        );

    const winMessage =
        document.getElementById(
            "winMessage"
        );


    winMessage.textContent =
        "🎊\n" +
        currentPlayer +
        " の勝ち!\n" +
        "🎊";


    winScreen.style.display =
        "flex";


    /* キラキラ生成 */

    createSparkles();

}


/* =========================================================
   キラキラ
   ========================================================= */

function createSparkles() {

    const winScreen =
        document.getElementById(
            "winScreen"
        );


    const symbols = [
        "✨",
        "✦",
        "✧",
        "🌟",
        "⭐"
    ];


    for (let i = 0; i < 40; i++) {

        const sparkle =
            document.createElement(
                "div"
            );

        sparkle.className =
            "sparkle";

        sparkle.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];


        sparkle.style.fontSize =
            (18 +
             Math.random() * 14) +
            "px";


        winScreen.appendChild(
            sparkle
        );


        /* -------------------------------------------------
           ランダムな方向
           ------------------------------------------------- */

        const angle =
            Math.random() *
            Math.PI * 2;


        const distance =
            100 +
            Math.random() * 220;


        const x =
            Math.cos(angle) *
            distance;


        const y =
            Math.sin(angle) *
            distance;


        const delay =
            Math.random() *
            350;


        /* -------------------------------------------------
           アニメーション
           ------------------------------------------------- */

        setTimeout(
            function () {

                sparkle.style.left =
                    "calc(50% + " +
                    x +
                    "px)";

                sparkle.style.top =
                    "calc(50% + " +
                    y +
                    "px)";

                sparkle.style.opacity =
                    "1";

            },
            delay
        );


        /* -------------------------------------------------
           消去
           ------------------------------------------------- */

        setTimeout(
            function () {

                sparkle.style.opacity =
                    "0";

            },
            1800
        );


        setTimeout(
            function () {

                sparkle.remove();

            },
            2300
        );

    }

}


/* =========================================================
   ゲームリセット
   ========================================================= */

function resetGame() {

    /* データ初期化 */

    createBoard();

    currentPlayer = "○";

    nextArea = null;

    gameOver = false;


    /* 状態表示 */

    document.getElementById("status")
        .textContent =
        "○ の番です";


    /* 勝利画面を隠す */

    document.getElementById(
        "winScreen"
    ).style.display = "none";


    /* キラキラ削除 */

    document
        .querySelectorAll(".sparkle")
        .forEach(
            sparkle => sparkle.remove()
        );


    /* 再描画 */

    drawBoard();

}


/* =========================================================
   ボタン
   ========================================================= */

document.getElementById("reset")
    .addEventListener(
        "click",
        resetGame
    );


document.getElementById("winReset")
    .addEventListener(
        "click",
        resetGame
    );


/* =========================================================
   ゲーム開始
   ========================================================= */

resetGame();

</script>

</body>
</html>
