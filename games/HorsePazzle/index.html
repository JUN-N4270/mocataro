<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           user-scalable=no"
>

<title>馬パズル</title>


<style>

:root {
  --cream: #f7f2e3;
  --pink: #ff5fa2;
  --ink: #33302a;
}


/* =====================================================
   基本
   ===================================================== */

* {
  box-sizing: border-box;
}


html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  background: var(--cream);

  color: var(--ink);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Hiragino Sans",
    Meiryo,
    sans-serif;

  overflow: hidden;

  overscroll-behavior: none;
}


/* =====================================================
   ヘッダー
   ===================================================== */

header {

  height: 53px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 12px 18px;

  background: white;

  border-bottom:
    1px solid #ece6d8;
}


h1 {

  font-size: 18px;

  margin: 0;

  font-weight: 700;
}


#shuffleBtn {

  background: none;

  border: none;

  color: var(--pink);

  font-size: 15px;

  font-weight: 700;

  cursor: pointer;

  padding: 8px 12px;

  -webkit-tap-highlight-color:
    transparent;
}


#shuffleBtn:active {

  opacity: 0.6;
}


/* =====================================================
   ボード
   ===================================================== */

#board {

  position: relative;

  width: 100%;

  height:
    calc(100% - 53px);

  overflow: hidden;

  background: var(--cream);

  touch-action: none;
}


/* =====================================================
   ピース
   ===================================================== */

.piece {

  position: absolute;

  left: 0;
  top: 0;

  /*
   * タッチ判定はboard側で行う
   */

  pointer-events: none;

  user-select: none;

  -webkit-user-select: none;

  -webkit-user-drag: none;

  -webkit-touch-callout: none;

  touch-action: none;

  transform-origin:
    center center;

  will-change: transform;
}


/* =====================================================
   ヒント
   ===================================================== */

#hint {

  position: absolute;

  bottom: 14px;

  left: 50%;

  transform:
    translateX(-50%);

  font-size: 12px;

  color: #9a9484;

  pointer-events: none;

  white-space: nowrap;
}

</style>

</head>


<body>


<header>

  <h1>馬パズル</h1>

  <button id="shuffleBtn">
    リセット
  </button>

</header>


<div id="board">


  <img
    class="piece"
    id="piece-left"
    src="left_horse.png"
    draggable="false"
    alt=""
  >


  <img
    class="piece"
    id="piece-rider"
    src="rider.png"
    draggable="false"
    alt=""
  >


  <img
    class="piece"
    id="piece-right"
    src="right_horse.png"
    draggable="false"
    alt=""
  >


  <div id="hint">
    ドラッグで移動 ・ タップで45度回転
  </div>


</div>


<script>

(function () {

  'use strict';


  // =====================================================
  // 元画像サイズ
  // =====================================================

  var ORIG_W = 1195;

  var ORIG_H = 896;


  // =====================================================
  // ピース定義
  // =====================================================

  var PIECE_DEFS = [

    {
      id: 'piece-left',
      width: 520,
      type: 'left'
    },

    {
      id: 'piece-rider',
      width: 163,
      type: 'rider'
    },

    {
      id: 'piece-right',
      width: 512,
      type: 'right'
    }

  ];


  // =====================================================
  // 操作設定
  // =====================================================

  var TAP_MOVE_THRESHOLD = 8;

  var MARGIN = 20;

  var RIDER_Z = 9999;


  // =====================================================
  // DOM
  // =====================================================

  var board =
    document.getElementById(
      'board'
    );


  var shuffleBtn =
    document.getElementById(
      'shuffleBtn'
    );


  // =====================================================
  // ピース
  // =====================================================

  var pieces = [];

  var zCounter = 1;


  // =====================================================
  // 初期化
  // =====================================================

  function initPieces() {

    pieces =
      PIECE_DEFS.map(
        function (def) {

          var el =
            document.getElementById(
              def.id
            );


          return {

            el: el,

            type: def.type,

            originalWidth:
              def.width,

            w: 0,

            h: 0,

            center: {
              x: 0,
              y: 0
            },

            angle: 0

          };

        }
      );


    /*
     * 騎手を常に最前面
     */

    pieces.forEach(
      function (piece) {

        if (
          piece.type === 'rider'
        ) {

          piece.el.style.zIndex =
            RIDER_Z;

        } else {

          piece.el.style.zIndex = 1;

        }

      }
    );


    /*
     * 初期配置
     *
     * 左馬 → 騎手 → 右馬
     */

    layout();

  }


  // =====================================================
  // レイアウト
  // =====================================================

  function layout() {

    var boardW =
      board.clientWidth;


    var boardH =
      board.clientHeight;


    /*
     * 画面に収まる倍率
     */

    var scaleW =
      (
        boardW -
        MARGIN * 2
      )
      /
      ORIG_W;


    var scaleH =
      (
        boardH -
        MARGIN * 2
      )
      /
      ORIG_H;


    var scale =
      Math.min(
        scaleW,
        scaleH
      );


    var scaledH =
      ORIG_H * scale;


    /*
     * 3枚を横一列に配置
     */

    var totalWidth = 0;


    pieces.forEach(
      function (piece) {

        totalWidth +=
          piece.originalWidth *
          scale;

      }
    );


    /*
     * 横中央
     */

    var xStart =
      (
        boardW -
        totalWidth
      ) / 2;


    /*
     * 縦中央
     */

    var yStart =
      (
        boardH -
        scaledH
      ) / 2;


    var x =
      xStart;


    pieces.forEach(
      function (piece) {

        piece.w =
          piece.originalWidth *
          scale;


        piece.h =
          scaledH;


        piece.center = {

          x:
            x +
            piece.w / 2,

          y:
            yStart +
            piece.h / 2

        };


        piece.el.style.width =
          piece.w + 'px';


        piece.el.style.height =
          piece.h + 'px';


        x += piece.w;

      }
    );


    renderAll();

  }


  // =====================================================
  // 描画
  // =====================================================

  function render(piece) {

    var x =
      piece.center.x -
      piece.w / 2;


    var y =
      piece.center.y -
      piece.h / 2;


    piece.el.style.transform =

      'translate(' +
      x +
      'px,' +
      y +
      'px) ' +

      'rotate(' +
      piece.angle +
      'deg)';

  }


  function renderAll() {

    pieces.forEach(
      function (piece) {

        render(piece);

      }
    );

  }


  // =====================================================
  // 前面へ
  // =====================================================

  function bringToFront(piece) {

    /*
     * 騎手は常に最前面
     */

    if (
      piece.type === 'rider'
    ) {

      return;

    }


    zCounter++;

    piece.el.style.zIndex =
      zCounter;

  }


  // =====================================================
  // リセット
  // =====================================================

  function resetPuzzle() {

    /*
     * 全ピースを角度0°に戻す
     */

    pieces.forEach(
      function (piece) {

        piece.angle = 0;

      }
    );


    /*
     * 初期配置へ戻す
     */

    layout();

  }


  // =====================================================
  // 座標取得
  // =====================================================

  function getBoardPoint(event) {

    var rect =
      board.getBoundingClientRect();


    return {

      x:
        event.clientX -
        rect.left,

      y:
        event.clientY -
        rect.top

    };

  }


  // =====================================================
  // ピース内部判定
  // =====================================================

  function pointInsidePiece(
    point,
    piece
  ) {

    var dx =
      point.x -
      piece.center.x;


    var dy =
      point.y -
      piece.center.y;


    /*
     * 回転を逆に戻す
     */

    var angle =
      -piece.angle *
      Math.PI / 180;


    var cosA =
      Math.cos(angle);


    var sinA =
      Math.sin(angle);


    var x =
      dx * cosA -
      dy * sinA;


    var y =
      dx * sinA +
      dy * cosA;


    /*
     * 長方形の中か
     */

    if (
      Math.abs(x) >
      piece.w / 2
    ) {

      return false;

    }


    if (
      Math.abs(y) >
      piece.h / 2
    ) {

      return false;

    }


    /*
     * 騎手の画像中央の空白部分は
     * タップ対象外
     */

    if (
      piece.type === 'rider'
    ) {

      var ny =
        (
          y +
          piece.h / 2
        )
        /
        piece.h;


      if (
        ny > 0.45 &&
        ny < 0.55
      ) {

        return false;

      }

    }


    return true;

  }


  // =====================================================
  // 一番上のピースを探す
  // =====================================================

  function hitTestPiece(point) {

    /*
     * 騎手を最優先
     */

    var rider =
      pieces.find(
        function (piece) {

          return (
            piece.type === 'rider'
          );

        }
      );


    if (
      rider &&
      pointInsidePiece(
        point,
        rider
      )
    ) {

      return rider;

    }


    /*
     * 馬を調べる
     */

    var candidates =
      pieces
        .filter(
          function (piece) {

            return (
              piece.type !== 'rider'
            );

          }
        )
        .sort(
          function (a, b) {

            return (
              parseInt(
                b.el.style.zIndex || 0
              )
              -
              parseInt(
                a.el.style.zIndex || 0
              )
            );

          }
        );


    for (
      var i = 0;
      i < candidates.length;
      i++
    ) {

      if (
        pointInsidePiece(
          point,
          candidates[i]
        )
      ) {

        return candidates[i];

      }

    }


    return null;

  }


  // =====================================================
  // pointerdown
  // =====================================================

  board.addEventListener(
    'pointerdown',
    function (event) {

      event.preventDefault();


      var point =
        getBoardPoint(
          event
        );


      var piece =
        hitTestPiece(
          point
        );


      /*
       * ピース以外
       */

      if (!piece) {

        return;

      }


      activePiece =
        piece;


      startX =
        point.x;


      startY =
        point.y;


      lastX =
        point.x;


      lastY =
        point.y;


      dragging = false;


      /*
       * 馬を前面へ
       *
       * 騎手は常に最前面
       */

      bringToFront(
        piece
      );


      /*
       * iPhoneのタッチを
       * boardで捕まえる
       */

      try {

        board.setPointerCapture(
          event.pointerId
        );

      } catch (e) {}

    },
    {
      passive: false
    }
  );


  // =====================================================
  // pointermove
  // =====================================================

  board.addEventListener(
    'pointermove',
    function (event) {

      if (!activePiece) {

        return;

      }


      event.preventDefault();


      var point =
        getBoardPoint(
          event
        );


      var totalDX =
        point.x -
        startX;


      var totalDY =
        point.y -
        startY;


      /*
       * 一定以上動いたらドラッグ
       */

      if (
        !dragging &&
        Math.hypot(
          totalDX,
          totalDY
        ) >
        TAP_MOVE_THRESHOLD
      ) {

        dragging = true;

      }


      /*
       * ドラッグ中
       */

      if (dragging) {

        var moveX =
          point.x -
          lastX;


        var moveY =
          point.y -
          lastY;


        activePiece.center.x +=
          moveX;


        activePiece.center.y +=
          moveY;


        lastX =
          point.x;


        lastY =
          point.y;


        render(
          activePiece
        );

      }

    },
    {
      passive: false
    }
  );


  // =====================================================
  // pointerup
  // =====================================================

  board.addEventListener(
    'pointerup',
    function (event) {

      if (!activePiece) {

        return;

      }


      event.preventDefault();


      /*
       * 動かしていなければタップ
       */

      if (!dragging) {

        activePiece.angle =
          (
            activePiece.angle +
            45
          ) % 360;


        render(
          activePiece
        );

      }


      activePiece = null;

      dragging = false;


      try {

        board.releasePointerCapture(
          event.pointerId
        );

      } catch (e) {}

    },
    {
      passive: false
    }
  );


  // =====================================================
  // pointercancel
  // =====================================================

  board.addEventListener(
    'pointercancel',
    function (event) {

      activePiece = null;

      dragging = false;


      try {

        board.releasePointerCapture(
          event.pointerId
        );

      } catch (e) {}

    }
  );


  // =====================================================
  // リセットボタン
  // =====================================================

  shuffleBtn.addEventListener(
    'click',
    function () {

      resetPuzzle();

    }
  );


  // =====================================================
  // 画面サイズ変更
  // =====================================================

  window.addEventListener(
    'resize',
    function () {

      /*
       * 画面回転などがあったら
       * 現在位置を維持したまま再描画
       */

      renderAll();

    }
  );


  // =====================================================
  // START
  // =====================================================

  initPieces();


})();

</script>

</body>
</html>
