<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>mocataro｜あそんで、つくって、たのしもう！</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                "Hiragino Kaku Gothic ProN",
                "Yu Gothic",
                sans-serif;

            background: #EAF6FC;
            color: #34505F;
        }

        /* ヘッダー */
        header {
            background: #78B9DD;
            color: white;
            text-align: center;
            padding: 28px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
            letter-spacing: 3px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 15px;
        }

        /* メイン */
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 25px 15px 50px;
        }

        /* メインカード */
        .menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 25px 20px;

            text-decoration: none;
            color: #34505F;

            box-shadow: 0 4px 12px rgba(50,120,160,0.12);

            transition:
                transform 0.15s,
                box-shadow 0.15s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 18px rgba(50,120,160,0.18);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .card h2 {
            margin: 5px 0 10px;
            font-size: 23px;
        }

        .card p {
            margin: 0;
            line-height: 1.6;
            color: #607D8B;
            font-size: 14px;
        }

        /* お知らせ */
        .section {
            margin-top: 35px;
        }

        .section h2 {
            font-size: 22px;

            border-left: 5px solid #78B9DD;
            padding-left: 10px;
        }

        .info {
            background: white;
            border-radius: 15px;
            padding: 20px;

            box-shadow: 0 3px 10px rgba(50,120,160,0.10);
        }

        .info p {
            line-height: 1.8;
            margin: 8px 0;
        }

        /* フッター */
        footer {
            text-align: center;

            background: #4D9BC7;
            color: white;

            padding: 25px 15px;
            font-size: 13px;
        }

        /* スマホ */
        @media (max-width: 600px) {

            header h1 {
                font-size: 34px;
            }

            .menu {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 22px 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>mocataro</h1>
    <p>あそんで、つくって、たのしもう！</p>
</header>

<main>

    <div class="menu">

        <!-- ゲーム -->
        <a class="card" href="games/">
            <div class="icon">🎮</div>
            <h2>ゲームで遊ぶ</h2>
            <p>
                Instagramで紹介したゲームを<br>
                実際に遊んでみよう！
            </p>
        </a>

        <!-- 工作 -->
        <a class="card" href="materials/">
            <div class="icon">🛠️</div>
            <h2>工作・遊びの素材</h2>
            <p>
                工作の図面や型紙などを<br>
                ダウンロードできます。
            </p>
        </a>

        <!-- Instagram -->
        <a class="card"
           href="https://www.instagram.com/"
           target="_blank"
           rel="noopener">
            <div class="icon">📱</div>
            <h2>Instagram</h2>
            <p>
                ゲームや工作を紹介している<br>
                Instagramをチェック！
            </p>
        </a>

        <!-- About -->
        <a class="card" href="about.html">
            <div class="icon">ℹ️</div>
            <h2>mocataroについて</h2>
            <p>
                mocataroって何？<br>
                このサイトについて紹介します。
            </p>
        </a>

    </div>


    <div class="section">

        <h2>🆕 お知らせ</h2>

        <div class="info">

            <p>
                🎮 新しいゲームを準備中！
            </p>

            <p>
                🛠️ 工作素材も順次追加していきます。
            </p>

        </div>

    </div>

</main>


<footer>
    © mocataro
</footer>

</body>
</html>
